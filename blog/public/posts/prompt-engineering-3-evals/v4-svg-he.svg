<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="1140" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="end">חמש שכבות eval, ומי מהן הייתה תופסת את אוגוסט</text><text x="1140" y="94" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">מהזול ליקר, מלמעלה למטה. הקלט: בוקר שבו שני agents החזירו אובייקט ריק</text><rect x="60" y="125" width="1080" height="80" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="1110" y="159" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">asserts בקוד</text><text x="1110" y="187" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">schema · שדות חובה · ספירת פריטים · רץ במילישניות</text><rect x="80" y="145" width="280" height="40" rx="6" fill="#ffb454"/><text x="220" y="172" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c" text-anchor="middle">נתפס כבר בבוקר הראשון</text><rect x="60" y="221" width="1080" height="80" rx="6" fill="#ffffff" stroke="#e4e4dc" stroke-width="2"/><text x="1110" y="255" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">golden set</text><text x="1110" y="283" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">ימים אמיתיים מה-archive, כולל הימים הרעים</text><rect x="80" y="241" width="280" height="40" rx="6" fill="none" stroke="#ffb454" stroke-width="2"/><text x="220" y="268" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">מעכשיו 5–7 באוגוסט בפנים</text><rect x="60" y="317" width="1080" height="80" rx="6" fill="#ffffff" stroke="#e4e4dc" stroke-width="2"/><text x="1110" y="351" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">LLM-as-judge</text><text x="1110" y="379" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">scorer אחד, לא האמת · לכייל מול תיוג של בן אדם</text><rect x="80" y="337" width="280" height="40" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="5 4"/><text x="220" y="364" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">מפספס: אין לו מה לדרג</text><rect x="60" y="413" width="1080" height="80" rx="6" fill="#ffffff" stroke="#e4e4dc" stroke-width="2"/><text x="1110" y="447" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">pairwise</text><text x="1110" y="475" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">prompt ישן מול חדש · פעמיים, בסדר הפוך</text><rect x="80" y="433" width="280" height="40" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="5 4"/><text x="220" y="460" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">מפספס</text><rect x="60" y="509" width="1080" height="80" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="1110" y="543" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">regression על traffic אמיתי</text><text x="1110" y="571" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">shadow על הקלטים של אתמול · diff בפריטים, שדות ריקים, אורך</text><rect x="80" y="529" width="280" height="40" rx="6" fill="#ffb454"/><text x="220" y="556" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c" text-anchor="middle">נתפס: ה-diff בספירה</text><text x="1140" y="635" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">שתי השכבות שתופסות לא קוראות למודל בכלל. ה-judge, השכבה היקרה, מפספס.</text></svg>