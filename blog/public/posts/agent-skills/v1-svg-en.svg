<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="80" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">What sits in context on every message</text><text x="40" y="150" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">One growing system prompt: from 200 to 5,000 tokens</text><rect x="40" y="170" width="1120" height="70" rx="6" fill="#12121c"/><text x="60" y="213" text-anchor="start" font-family="Heebo" font-size="20" fill="#f6f3ea">Everything, always: tests, deploy, PDF, SQL, review, release notes</text><text x="40" y="315" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Agent Skills: only what the task needs</text><rect x="40" y="335" width="1120" height="70" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><rect x="50" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="86" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="122" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="158" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="194" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="230" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="266" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="302" y="343" width="26" height="54" rx="3" fill="#6d6d80"/><rect x="380" y="343" width="220" height="54" rx="6" fill="#ff7aa8"/><text x="490" y="377" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Active SKILL.md</text><rect x="720" y="343" width="150" height="54" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><text x="795" y="377" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">scripts/</text><text x="1140" y="377" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">Free for work</text><line x1="202" y1="405" x2="202" y2="445" stroke="#12121c" stroke-width="1"/><text x="40" y="470" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Every skill's name + description: always loaded</text><line x1="490" y1="405" x2="490" y2="530" stroke="#ff7aa8" stroke-width="2"/><text x="380" y="555" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Skill body: only when the description matches</text><line x1="795" y1="405" x2="795" y2="605" stroke="#6d6d80" stroke-width="1" stroke-dasharray="4 4"/><text x="680" y="630" text-anchor="start" font-family="Heebo" font-size="19" fill="#6d6d80">scripts/references: only if instructions ask</text></svg>