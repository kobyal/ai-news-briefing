<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="1160" y="70" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">גרוק בוט מול ארנד: מי מחזיק את המחשב</text><text x="1160" y="106" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">אותו מוצר על הנייר, החלטה הפוכה בשורה הראשונה</text><text x="840" y="165" text-anchor="end" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">Grok Bot</text><text x="440" y="165" text-anchor="end" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">Errand</text><line x1="40" y1="185" x2="1160" y2="185" stroke="#12121c" stroke-width="2"/><line x1="860" y1="140" x2="860" y2="612" stroke="#e4e4dc" stroke-width="1"/><line x1="455" y1="140" x2="455" y2="612" stroke="#e4e4dc" stroke-width="1"/><rect x="40" y="192" width="1120" height="76" rx="6" fill="#3ecfb2" fill-opacity="0.14" stroke="#3ecfb2" stroke-width="2"/><text x="1140" y="238" text-anchor="end" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">מחשב בענן</text><text x="840" y="238" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">אחד למשתמש, משותף לכל הבוטים</text><text x="440" y="238" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">מכונה מבודדת לכל חבר צוות</text><line x1="40" y1="272" x2="1160" y2="272" stroke="#e4e4dc" stroke-width="1"/><text x="1140" y="323" text-anchor="end" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">בחירת מודל</text><text x="840" y="323" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">רק גרוק, בלי הגדרות</text><text x="440" y="323" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">יש ברירת מחדל, ואפשר להחליף</text><line x1="40" y1="357" x2="1160" y2="357" stroke="#e4e4dc" stroke-width="1"/><text x="1140" y="408" text-anchor="end" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">עד הבוט הראשון</text><text x="840" y="408" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">דקות, התחברות דרך קרסור</text><text x="440" y="408" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">שבוע פיתוח וכ-4000 שורות</text><line x1="40" y1="442" x2="1160" y2="442" stroke="#e4e4dc" stroke-width="1"/><text x="1140" y="493" text-anchor="end" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">מחיר</text><text x="840" y="493" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">בין $20 ל-$300 לחודש</text><text x="440" y="493" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">קוד חינמי, התשתית עליכם</text><line x1="40" y1="527" x2="1160" y2="527" stroke="#e4e4dc" stroke-width="1"/><text x="1140" y="578" text-anchor="end" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">פלטפורמות</text><text x="840" y="578" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">מחשב, אייפון ואנדרואיד</text><text x="440" y="578" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">אפליקציית מחשב בלבד</text><line x1="40" y1="612" x2="1160" y2="612" stroke="#12121c" stroke-width="2"/><text x="1160" y="650" text-anchor="end" font-family="Heebo" font-size="15" fill="#6d6d80">מקורות: פוסט ההשקה (אוגוסט) ובלוג של ראנטה (ספטמבר)</text></svg>