<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">The model gives a number. The threshold decides.</text><text x="40" y="118" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Phishing email, 0.6B-parameter model, 25 lines of code</text><text x="1160" y="118" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">nobodywho.ai · 2026-09-22</text><line x1="40" y1="145" x2="1160" y2="145" stroke="#dcd7c8" stroke-width="1"/><text x="60" y="222" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Phishing</text><text x="60" y="302" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Spam</text><text x="60" y="382" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Legitimate</text><rect x="240" y="190" width="620" height="48" rx="6" fill="#8b83ff"/><text x="875" y="223" text-anchor="start" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c">0.885</text><rect x="240" y="270" width="59" height="48" rx="6" fill="#6d6d80"/><text x="312" y="303" text-anchor="start" font-family="Heebo" font-size="22" fill="#6d6d80">0.084</text><rect x="240" y="350" width="22" height="48" rx="6" fill="#6d6d80"/><text x="275" y="383" text-anchor="start" font-family="Heebo" font-size="22" fill="#6d6d80">0.031</text><line x1="240" y1="420" x2="940" y2="420" stroke="#12121c" stroke-width="2"/><text x="240" y="446" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">0</text><text x="590" y="446" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">0.5</text><text x="800" y="446" text-anchor="middle" font-family="Heebo" font-size="16" fill="#12121c">0.8</text><text x="940" y="446" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">1</text><line x1="800" y1="165" x2="800" y2="420" stroke="#12121c" stroke-width="2" stroke-dasharray="8 6"/><text x="812" y="178" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">threshold 0.8</text><rect x="60" y="490" width="500" height="110" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="84" y="535" text-anchor="start" font-family="Heebo" font-size="24" fill="#6d6d80">Below 0.8: goes to a human</text><text x="84" y="572" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Borderline cases land in the queue</text><rect x="640" y="490" width="520" height="110" rx="6" fill="#8b83ff" fill-opacity="0.15" stroke="#8b83ff" stroke-width="2"/><text x="664" y="535" text-anchor="start" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c">Above 0.8: the code acts alone</text><text x="664" y="572" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Blocks the email without writing a word</text><path d="M 860 238 C 900 330 900 420 900 476" fill="none" stroke="#8b83ff" stroke-width="2"/><polygon points="892,474 908,474 900,488" fill="#8b83ff"/><text x="40" y="645" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">Raw, uncalibrated probability: 0.885 here does not mean it is right 88.5% of the time</text></svg>