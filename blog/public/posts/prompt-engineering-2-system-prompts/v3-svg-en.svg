<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="60" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">The TTL starts when the request leaves</text><line x1="60" y1="88" x2="1140" y2="88" stroke="#e4e4dc" stroke-width="1"/><rect x="760" y="120" width="160" height="340" fill="#ffb454" fill-opacity="0.22"/><line x1="920" y1="112" x2="920" y2="470" stroke="#12121c" stroke-width="2" stroke-dasharray="6 5"/><text x="935" y="108" font-family="Heebo" font-size="17" fill="#12121c">cache expires here</text><rect x="120" y="150" width="640" height="60" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="140" y="188" font-family="Heebo" font-size="21" fill="#12121c">Request 1 · response streams for 4 min</text><rect x="1000" y="150" width="140" height="60" rx="6" fill="#fbfbf9" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 5"/><text x="1015" y="188" font-family="Heebo" font-size="19" fill="#6d6d80">Request 2</text><text x="1140" y="240" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">miss · rewrite at 1.25×</text><rect x="120" y="260" width="800" height="44" rx="6" fill="none" stroke="#ffb454" stroke-width="3"/><text x="140" y="289" font-family="Heebo" font-size="19" fill="#12121c">5-minute TTL, from the start of request 1</text><text x="775" y="380" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c">≈ 1 minute</text><text x="775" y="410" font-family="Heebo" font-size="17" fill="#6d6d80">to send the next one</text><line x1="120" y1="500" x2="1150" y2="500" stroke="#12121c" stroke-width="2"/><line x1="120" y1="492" x2="120" y2="508" stroke="#12121c" stroke-width="2"/><line x1="280" y1="492" x2="280" y2="508" stroke="#12121c" stroke-width="2"/><line x1="440" y1="492" x2="440" y2="508" stroke="#12121c" stroke-width="2"/><line x1="600" y1="492" x2="600" y2="508" stroke="#12121c" stroke-width="2"/><line x1="760" y1="492" x2="760" y2="508" stroke="#12121c" stroke-width="2"/><line x1="920" y1="492" x2="920" y2="508" stroke="#12121c" stroke-width="2"/><line x1="1080" y1="492" x2="1080" y2="508" stroke="#12121c" stroke-width="2"/><text x="120" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">0</text><text x="280" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">1</text><text x="440" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">2</text><text x="600" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">3</text><text x="760" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">4</text><text x="920" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">5</text><text x="1080" y="535" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">6</text><text x="120" y="570" font-family="Heebo" font-size="17" fill="#6d6d80">minutes since request 1 started</text><rect x="120" y="600" width="1020" height="46" rx="6" fill="none" stroke="#e4e4dc" stroke-width="1"/><text x="140" y="630" font-family="Heebo" font-size="18" fill="#12121c">1-hour TTL: the same prefix stays warm across agents that run one after another</text></svg>