<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="60" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">A loop with two exits</text><text x="60" y="106" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">The model exits when it has enough, or when the budget runs out</text><rect x="60" y="170" width="260" height="390" rx="6" fill="none" stroke="#e4e4dc" stroke-width="2"/><text x="80" y="204" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">single-shot</text><rect x="90" y="230" width="200" height="46" rx="6" fill="none" stroke="#6d6d80" stroke-width="1"/><text x="106" y="260" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Question</text><line x1="190" y1="276" x2="190" y2="330" stroke="#6d6d80" stroke-width="1"/><rect x="90" y="330" width="200" height="46" rx="6" fill="none" stroke="#6d6d80" stroke-width="1"/><text x="106" y="360" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">One search</text><line x1="190" y1="376" x2="190" y2="430" stroke="#6d6d80" stroke-width="1"/><rect x="90" y="430" width="200" height="46" rx="6" fill="none" stroke="#6d6d80" stroke-width="1"/><text x="106" y="460" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Answer</text><text x="80" y="530" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">Missed? No recovery</text><line x1="360" y1="160" x2="360" y2="600" stroke="#e4e4dc" stroke-width="1"/><circle cx="660" cy="390" r="150" fill="none" stroke="#5fb7ff" stroke-width="2"/><polygon points="561,277 555,293 545,283" fill="#5fb7ff"/><polygon points="773,291 757,285 767,275" fill="#5fb7ff"/><polygon points="759,503 775,497 765,487" fill="#5fb7ff"/><polygon points="547,489 553,505 563,495" fill="#5fb7ff"/><rect x="410" y="360" width="200" height="60" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="426" y="386" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Search</text><text x="426" y="408" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">search_knowledge_base</text><rect x="560" y="210" width="200" height="60" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="576" y="236" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Read</text><text x="576" y="258" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">fetch_document_section</text><rect x="710" y="360" width="200" height="60" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="726" y="386" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Evaluate</text><text x="726" y="408" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">relevant? enough?</text><rect x="560" y="510" width="200" height="60" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="576" y="536" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Rewrite query</text><text x="576" y="558" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">rewrite</text><path d="M910 380 H935 V285 H950" fill="none" stroke="#12121c" stroke-width="2"/><polygon points="960,285 950,279 950,291" fill="#12121c"/><text x="826" y="336" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Enough found</text><rect x="960" y="250" width="200" height="70" rx="6" fill="#5fb7ff" stroke="#5fb7ff" stroke-width="2"/><text x="976" y="292" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Answer + citations</text><path d="M910 400 H935 V500 H950" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 5"/><polygon points="960,500 950,494 950,506" fill="#6d6d80"/><text x="826" y="456" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Budget spent</text><rect x="960" y="460" 