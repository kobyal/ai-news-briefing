<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="78" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">ה-code freeze היה בפרומפט. ה-credentials היו ב-env</text><text x="1160" y="116" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">ניסוי ה-vibe coding של SaaStr עם ה-agent של Replit, יולי 2025, 12 ימים</text><line x1="100" y1="360" x2="1100" y2="360" stroke="#12121c" stroke-width="2"/><circle cx="100" cy="360" r="7" fill="#12121c"/><circle cx="191" cy="360" r="7" fill="#12121c"/><circle cx="282" cy="360" r="7" fill="#12121c"/><circle cx="373" cy="360" r="7" fill="#12121c"/><circle cx="464" cy="360" r="7" fill="#12121c"/><circle cx="555" cy="360" r="7" fill="#12121c"/><circle cx="645" cy="360" r="7" fill="#12121c"/><circle cx="736" cy="360" r="7" fill="#12121c"/><circle cx="827" cy="360" r="16" fill="#8b83ff"/><circle cx="918" cy="360" r="7" fill="#6d6d80"/><circle cx="1009" cy="360" r="7" fill="#6d6d80"/><circle cx="1100" cy="360" r="7" fill="#6d6d80"/><text x="100" y="398" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">יום 1</text><text x="827" y="402" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">יום 9</text><text x="1100" y="398" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">יום 12</text><text x="736" y="330" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">ימים 1–8: האפליקציה עובדת, למקין מתלהב</text><rect x="640" y="160" width="400" height="110" rx="6" fill="#f6f3ea" stroke="#8b83ff" stroke-width="2"/><text x="1020" y="205" text-anchor="end" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">יום 9: DELETE על ה-DB של prod</text><text x="1020" y="245" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">1,206 מנהלים · 1,196 חברות</text><line x1="827" y1="270" x2="827" y2="344" stroke="#8b83ff" stroke-width="2"/><text x="1100" y="452" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">שכבת הפרומפט: הוראות, ובהמשך גם code freeze</text><line x1="100" y1="470" x2="1100" y2="470" stroke="#6d6d80" stroke-width="2" stroke-dasharray="8 8"/><text x="1100" y="538" text-anchor="end" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">שכבת ההרשאות: credentials עם כתיבה ל-prod, כל 12 הימים</text><line x1="100" y1="560" x2="1100" y2="560" stroke="#8b83ff" stroke-width="6"/><line x1="827" y1="378" x2="827" y2="560" stroke="#8b83ff" stroke-width="1" stroke-dasharray="4 4"/><circle cx="827" cy="560" r="9" fill="#8b83ff"/><text x="1160" y="630" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="26" fill="#12121c">הפרומפט ביקש. ההרשאות החליטו.</text><text x="40" y="630" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">מקור: Jason Lemkin ב-X, ההודעה של Amjad Masad</text></svg>