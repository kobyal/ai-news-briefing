<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">One long window vs. a relay of short sessions</text><text x="40" y="140" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">One session, a 1M-token window</text><rect x="80" y="165" width="1040" height="56" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="496" y="167" width="208" height="52" fill="#8b83ff" fill-opacity="0.35"/><text x="600" y="200" text-anchor="middle" font-family="Heebo" font-size="18" font-weight="700" fill="#12121c">Dumb Zone 40–60%</text><line x1="496" y1="150" x2="496" y2="236" stroke="#12121c" stroke-width="2"/><text x="80" y="245" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">0</text><text x="1120" y="245" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">1M</text><text x="502" y="268" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">Around 400K: starts wrapping up unfinished work</text><line x1="40" y1="305" x2="1160" y2="305" stroke="#dcd7c8" stroke-width="1"/><text x="40" y="355" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Four sessions, each one starts clean</text><rect x="80" y="390" width="200" height="120" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="360" y="390" width="200" height="120" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="640" y="390" width="200" height="120" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="920" y="390" width="200" height="120" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="180" y="430" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">session 1</text><text x="460" y="430" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">session 2</text><text x="740" y="430" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">session 3</text><text x="1020" y="430" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">session 4</text><rect x="92" y="466" width="176" height="14" rx="3" fill="none" stroke="#6d6d80" stroke-width="1"/><rect x="92" y="466" width="58" height="14" rx="3" fill="#8b83ff"/><rect x="372" y="466" width="176" height="14" rx="3" fill="none" stroke="#6d6d80" stroke-width="1"/><rect x="372" y="466" width="64" height="14" rx="3" fill="#8b83ff"/><rect x="652" y="466" width="176" height="14" rx="3" fill="none" stroke="#6d6d80" stroke-width="1"/><rect x="652" y="466" width="52" height="14" rx="3" fill="#8b83ff"/><rect x="932" y="466" width="176" height="14" rx="3" fill="none" stroke="#6d6d80" stroke-width="1"/><rect x="932" y="466" width="60" height="14" rx="3" fill="#8b83ff"/><line x1="290" y1="450" x2="348" y2="450" stroke="#12121c" stroke-width="2"/><polygon points="348,443 360,450 348,457" fill="#12121c"/><line x1="570" y1="450" x2="628" y2="450" stroke="#12121c" stroke-width="2"/><polygon points="628,443 640,450 628,457" fill="#12121c"/><line x1="850" y1="450" x2="908" y2="450" stroke="#12121c" stroke-width="2"/><polygon points="908,443 920,450 908,457" fill="#12121c"/><text x="180" y="545" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">pytest: pass</text><text x="460" y="545" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">pytest: pass</text><text x="740" y="545" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">pytest: pass</text><text x="1020" y="545" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">pytest: pass</text><text x="40" y="610" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Between sessions, only progress.json, NOTES.md and a commit get passed on</text><text x="40" y="642" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Each session uses about a third of the window, far from the Dumb Zone</text></svg>