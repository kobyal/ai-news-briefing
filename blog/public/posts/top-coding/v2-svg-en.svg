<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">106 days, and the #1 spot runs a different model</text><text x="40" y="116" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">2026, according to the lists themselves</text><line x1="100" y1="380" x2="1100" y2="380" stroke="#12121c" stroke-width="2"/><line x1="630" y1="380" x2="983" y2="380" stroke="#3ecfb2" stroke-width="8"/><line x1="100" y1="372" x2="100" y2="388" stroke="#6d6d80" stroke-width="1"/><line x1="400" y1="372" x2="400" y2="388" stroke="#6d6d80" stroke-width="1"/><line x1="703" y1="372" x2="703" y2="388" stroke="#6d6d80" stroke-width="1"/><line x1="1010" y1="372" x2="1010" y2="388" stroke="#6d6d80" stroke-width="1"/><text x="104" y="408" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Jan</text><text x="404" y="408" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Apr</text><text x="707" y="408" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Jul</text><text x="1014" y="408" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Oct</text><path d="M630 300 V288 H983 V300" fill="none" stroke="#3ecfb2" stroke-width="2"/><text x="638" y="272" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">106 days: the ranking froze, the model moved</text><line x1="130" y1="371" x2="130" y2="352" stroke="#6d6d80" stroke-width="1"/><circle cx="130" cy="380" r="9" fill="#12121c"/><text x="112" y="318" text-anchor="start" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">January 9 · Mehul Gupta</text><text x="112" y="342" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">Cursor first, Claude Code third</text><line x1="630" y1="389" x2="630" y2="430" stroke="#6d6d80" stroke-width="1"/><circle cx="630" cy="380" r="9" fill="#12121c"/><text x="640" y="455" text-anchor="end" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">June 8 · SSOJet</text><text x="640" y="480" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">Opus 4.8: 88.6% on SWE-bench Verified</text><text x="640" y="503" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">12 agents, pick one in an afternoon</text><line x1="983" y1="392" x2="940" y2="522" stroke="#3ecfb2" stroke-width="2" stroke-dasharray="4 4"/><circle cx="983" cy="380" r="12" fill="#3ecfb2" stroke="#12121c" stroke-width="2"/><text x="960" y="547" text-anchor="end" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">September 22 · Opus 5.5</text><text x="960" y="572" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">Claude Code default the same day</text><line x1="1000" y1="374" x2="1000" y2="236" stroke="#6d6d80" stroke-width="1"/><circle cx="1000" cy="380" r="7" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="1160" y="205" text-anchor="end" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">September 24 · MightyBot</text><text x="1160" y="228" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">66 vs 62 on the Coding Agent Index</text><line x1="1083" y1="389" x2="1083" y2="430" stroke="#6d6d80" stroke-width="1"/><circle cx="1083" cy="380" r="9" fill="#12121c"/><text x="1160" y="455" text-anchor="end" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">October 22 · Faros</text><text x="1160" y="480" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">Windsurf still on the list</text><line x1="40" y1="610" x2="1160" y2="610" stroke="#dcd7c8" stroke-width="1"/><text x="40" y="640" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Sources: Medium (January), SSOJet (June), MightyBot (September), Faros (October)</text><