<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="72" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">Who picks the next step</text><text x="40" y="108" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Same tools, three architectures</text><text x="40" y="196" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">script</text><text x="40" y="222" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Code decides everything</text><rect x="340" y="170" width="130" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="405" y="206" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Vale</text><rect x="500" y="170" width="130" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="565" y="206" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Lychee</text><rect x="660" y="170" width="130" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="725" y="206" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Codespell</text><rect x="820" y="170" width="150" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="895" y="206" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">pass / fail</text><line x1="470" y1="200" x2="492" y2="200" stroke="#12121c" stroke-width="2"/><polygon points="492,194 500,200 492,206" fill="#12121c"/><line x1="630" y1="200" x2="652" y2="200" stroke="#12121c" stroke-width="2"/><polygon points="652,194 660,200 652,206" fill="#12121c"/><line x1="790" y1="200" x2="812" y2="200" stroke="#12121c" stroke-width="2"/><polygon points="812,194 820,200 812,206" fill="#12121c"/><line x1="40" y1="265" x2="1160" y2="265" stroke="#dcd7c8" stroke-width="1"/><text x="40" y="326" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">agentic workflow</text><text x="40" y="352" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Code holds the path, the model judges</text><rect x="340" y="300" width="130" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="405" y="336" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Vale</text><rect x="500" y="300" width="130" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="565" y="336" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Lychee</text><rect x="660" y="300" width="130" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="725" y="336" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Codespell</text><rect x="820" y="300" width="150" height="60" rx="6" fill="#5fb7ff" stroke="#12121c" stroke-width="2"/><text x="895" y="336" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">LLM review</text><rect x="1000" y="300" width="160" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="1080" y="336" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">comment, max 1</text><line x1="470" y1="330" x2="492" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="492,324 500,330 492,336" fill="#12121c"/><line x1="630" y1="330" x2="652" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="652,324 660,330 652,336" fill="#12121c"/><line x1="790" y1="330" x2="812" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="812,324 820,330 812,336" fill="#12121c"/><line x1="970" y1="330" x2="992" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="992,324 1000,330 992,336" fill="#12121c"/><text x="895" y="388" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">judgment only at this node</text><line x1="40" y1="410" x2="116