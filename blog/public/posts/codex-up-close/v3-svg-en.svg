<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3ecfb2"/></marker></defs><rect width="1200" height="675" fill="#fbfbf9"/><text x="40" y="64" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Codex fans out, Claude Code folds in</text><line x1="600" y1="100" x2="600" y2="610" stroke="#e4e4dc" stroke-width="1"/><text x="40" y="118" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Codex: one agent on six surfaces</text><text x="640" y="118" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Claude Code: one terminal, a tight loop</text><line x1="300" y1="370" x2="300" y2="180" stroke="#12121c" stroke-width="2"/><line x1="300" y1="370" x2="125" y2="275" stroke="#12121c" stroke-width="2"/><line x1="300" y1="370" x2="125" y2="465" stroke="#12121c" stroke-width="2"/><line x1="300" y1="370" x2="300" y2="560" stroke="#12121c" stroke-width="2"/><line x1="300" y1="370" x2="475" y2="465" stroke="#12121c" stroke-width="2"/><line x1="300" y1="370" x2="475" y2="275" stroke="#12121c" stroke-width="2"/><circle cx="300" cy="370" r="64" fill="#3ecfb2"/><text x="300" y="379" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c">Codex</text><rect x="230" y="157" width="140" height="46" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="300" y="187" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">CLI</text><rect x="55" y="252" width="140" height="46" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="125" y="282" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">IDE</text><rect x="55" y="442" width="140" height="46" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="125" y="472" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Cloud agents</text><rect x="230" y="537" width="140" height="46" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="300" y="567" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">Phone</text><rect x="405" y="442" width="140" height="46" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="475" y="472" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">PR review</text><rect x="405" y="252" width="140" height="46" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="475" y="282" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">computer use</text><text x="40" y="630" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">4M a week · 90+ plugins · 1.7GB runtime</text><path d="M 1060 180 H 720 Q 680 180 680 220 V 460 Q 680 500 720 500 H 1060 Q 1100 500 1100 460 V 240" fill="none" stroke="#3ecfb2" stroke-width="2" marker-end="url(#ah)"/><rect x="730" y="230" width="320" height="220" rx="6" fill="#12121c"/><text x="750" y="268" text-anchor="start" font-family="Heebo" font-size="20" fill="#3ecfb2">$ claude</text><text x="750" y="312" text-anchor="start" font-family="Heebo" font-size="18" fill="#fbfbf9">reads the code</text><text x="750" y="347" text-anchor="start" font-family="Heebo" font-size="18" fill="#fbfbf9">edits</text><text x="750" y="382" text-anchor="start" font-family="Heebo" font-size="18" fill="#fbfbf9">runs tests</text><text x="750" y="417" text-anchor="start" font-family="Heebo" font-size="18" fill="#fbfbf9">fixes and loops</text><text x="680" y="560" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Same $20 to get in, opposite bet</text><text x="1140" y="630" text-anchor="end" font-family="Heebo" font-size="18" fill="#12121c">CLAUDE.md · hooks · subagents · claude -p</text></svg>