<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" font-family="Frank Ruhl Libre" font-weight="700" font-size="42" fill="#12121c" text-anchor="start">The bottleneck moved to verification</text><text x="40" y="118" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="start">Writing no longer slows teams down. Verification, review and security do</text><text x="80" y="180" font-family="Heebo" font-size="22" fill="#12121c" text-anchor="start">Changes the agent produces</text><rect x="210" y="200" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="140" y="200" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="70" y="200" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="210" y="250" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="140" y="250" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="70" y="250" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="210" y="300" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="140" y="300" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="70" y="300" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="210" y="350" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="140" y="350" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="70" y="350" width="50" height="34" rx="6" fill="#3ecfb2"/><polygon points="300,190 300,400 550,325 550,265" fill="none" stroke="#12121c" stroke-width="2"/><rect x="550" y="255" width="170" height="80" rx="6" fill="#12121c"/><text x="635" y="305" font-family="Heebo" font-size="28" fill="#f6f3ea" text-anchor="middle">Checks</text><text x="635" y="370" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">build · tests · review · security</text><line x1="720" y1="295" x2="900" y2="295" stroke="#12121c" stroke-width="2"/><polygon points="904,295 886,286 886,304" fill="#12121c"/><rect x="940" y="278" width="50" height="34" rx="6" fill="#3ecfb2"/><rect x="1010" y="278" width="50" height="34" rx="6" fill="#3ecfb2"/><text x="1080" y="255" font-family="Heebo" font-size="22" fill="#12121c" text-anchor="end">production</text><text x="1080" y="345" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">What actually ships</text><line x1="80" y1="460" x2="1080" y2="460" stroke="#dcd7c8" stroke-width="1"/><text x="80" y="515" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">Models sustain 2:17h of work (METR, 2025)</text><text x="80" y="552" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="start">and that doubles about every 7 months</text><text x="1080" y="515" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="end">Meta counts only changes past review</text><text x="1080" y="552" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="end">not lines of code, not open PRs</text><line x1="600" y1="490" x2="600" y2="580" stroke="#dcd7c8" stroke-width="1"/><text x="80" y="630" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="start">Output runs at machine speed. Verification still runs at human speed</text></svg>