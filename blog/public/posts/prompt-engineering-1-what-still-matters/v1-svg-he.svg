<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="1160" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="end">חצי מה-prompt של 2023 כתוב היום בקוד</text><text x="1160" y="98" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">שורה אחרי שורה: מה מת, מה עבר ל-harness, ומה נשאר</text><rect x="660" y="140" width="500" height="480" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="1140" y="174" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">prompt טיפוסי, 2023</text><line x1="680" y1="190" x2="1140" y2="190" stroke="#e4e4dc" stroke-width="1"/><text x="1140" y="240" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="end">אתה מומחה עולמי ב-X</text><line x1="920" y1="233" x2="1145" y2="233" stroke="#12121c" stroke-width="2"/><text x="880" y="240" font-family="Heebo" font-size="15" fill="#6d6d80" text-anchor="end">מת · המודל עושה לבד</text><text x="1140" y="300" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="end">תחשוב צעד אחר צעד</text><line x1="945" y1="293" x2="1145" y2="293" stroke="#12121c" stroke-width="2"/><text x="880" y="300" font-family="Heebo" font-size="15" fill="#6d6d80" text-anchor="end">מת · reasoning models</text><text x="1140" y="365" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="end">החזר JSON בלבד, בלי הסברים</text><text x="1140" y="430" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="end">הנה כל הלוג של ה-debug…</text><text x="1140" y="495" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="end">תוודא שהקוד עובד</text><rect x="680" y="540" width="460" height="60" rx="6" fill="#ffb454"/><text x="1120" y="578" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">מה אני באמת רוצה, ואיפה לעצור</text><text x="1160" y="652" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">נשאר ב-prompt: הכוונה</text><text x="480" y="174" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">harness · קוד</text><rect x="40" y="200" width="440" height="90" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="460" y="238" font-family="Heebo" font-weight="700" font-size="21" fill="#12121c" text-anchor="end">Structured Outputs</text><text x="460" y="268" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">פורמט ופענוח בקוד, לא בניסוח</text><rect x="40" y="310" width="440" height="90" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="460" y="348" font-family="Heebo" font-weight="700" font-size="21" fill="#12121c" text-anchor="end">context engineering</text><text x="460" y="378" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">סשן debug אחד שורף עשרות אלפי tokens</text><rect x="40" y="420" width="440" height="90" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="460" y="458" font-family="Heebo" font-weight="700" font-size="21" fill="#12121c" text-anchor="end">בדיקת pass / fail</text><text x="460" y="488" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">טסטים · exit code · linter · diff</text><path d="M680 358 C580 358 580 245 498 245" fill="none" stroke="#6d6d80" stroke-width="2"/><polygon points="484,245 498,238 498,252" fill="#6d6d80"/><path d="M680 423 C580 423 580 355 498 355" fill="none" stroke="#6d6d80" stroke-width="2"/><polygon points="484,355 498,348 498,362" fill="#6d6d80"/><path d="M680 488 C580 488 580 465 498 465" fill="none" stroke="#6d6d80" stroke-width="2"/><polygon points="484,465 498,458 498,472" fill="#6d6d80"/><line x1="40" y1="545" x2="480" y2="545" stroke="#e4e4dc" stroke-width="1"/><text x="480" y="585" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">3 שורות עברו לקוד · 2 מתו · 1 נשארה</text></svg>