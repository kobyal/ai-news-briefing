<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="78" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">מי מחליט שסיימנו</text><text x="1160" y="118" text-anchor="end" font-family="Heebo" font-size="22" fill="#6d6d80">לא המודל. קוד היציאה.</text><line x1="40" y1="150" x2="1160" y2="150" stroke="#dcd7c8" stroke-width="1"/><rect x="80" y="240" width="260" height="120" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="210" y="292" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="28" fill="#12121c">Edit / Write</text><text x="210" y="328" text-anchor="middle" font-family="Heebo" font-size="20" fill="#6d6d80">עריכת קובץ</text><line x1="340" y1="300" x2="460" y2="300" stroke="#12121c" stroke-width="2"/><polygon points="470,300 456,292 456,308" fill="#12121c"/><rect x="470" y="230" width="260" height="140" rx="6" fill="#f6f3ea" stroke="#5fb7ff" stroke-width="4"/><text x="600" y="285" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="28" fill="#12121c">PostToolUse</text><text x="600" y="322" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">typecheck + tests</text><text x="600" y="352" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">timeout 120s</text><line x1="730" y1="300" x2="850" y2="300" stroke="#12121c" stroke-width="2"/><polygon points="860,300 846,292 846,308" fill="#12121c"/><text x="795" y="284" text-anchor="middle" font-family="Heebo" font-size="20" fill="#6d6d80">exit 0</text><rect x="860" y="240" width="260" height="120" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="990" y="292" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="28" fill="#12121c">commit</text><text x="990" y="328" text-anchor="middle" font-family="Heebo" font-size="20" fill="#6d6d80">רק עריכה שעברה</text><path d="M600 370 L600 470 L210 470 L210 376" fill="none" stroke="#5fb7ff" stroke-width="3"/><polygon points="210,362 202,378 218,378" fill="#5fb7ff"/><text x="405" y="456" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">exit 2</text><text x="405" y="505" text-anchor="middle" font-family="Heebo" font-size="20" fill="#12121c">השגיאה חוזרת למודל, והוא מתקן</text><line x1="990" y1="360" x2="990" y2="520" stroke="#12121c" stroke-width="2"/><polygon points="990,530 982,516 998,516" fill="#12121c"/><rect x="860" y="530" width="260" height="90" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2" stroke-dasharray="6 6"/><text x="990" y="570" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c">git diff</text><text x="990" y="602" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">אתם קוראים, לא הסיכום</text><text x="780" y="640" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">בלי אכיפה, זו רק בקשה בטקסט</text><text x="40" y="640" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Claude Code hooks</text></svg>