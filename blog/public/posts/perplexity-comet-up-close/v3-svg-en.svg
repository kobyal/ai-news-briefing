<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="64" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">How far a malicious page reaches, by where the agent lives</text><text x="40" y="98" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Each ring is what the agent can touch from a single task</text><line x1="40" y1="120" x2="1160" y2="120" stroke="#e4e4dc" stroke-width="1"/><rect x="1140" y="148" width="20" height="20" rx="6" fill="#ff7aa8" fill-opacity="0.35" stroke="#ff7aa8" stroke-width="2"/><text x="1130" y="164" text-anchor="end" font-family="Heebo" font-size="16" fill="#12121c">Range where prompt injection was demonstrated</text><circle cx="250" cy="360" r="180" fill="#ff7aa8" fill-opacity="0.14" stroke="#ff7aa8" stroke-width="2"/><circle cx="250" cy="360" r="135" fill="none" stroke="#ff7aa8" stroke-width="2"/><circle cx="250" cy="360" r="90" fill="none" stroke="#ff7aa8" stroke-width="2"/><circle cx="250" cy="360" r="45" fill="#ff7aa8"/><text x="250" y="206" text-anchor="middle" font-family="Heebo" font-size="14" fill="#12121c">Passwords &amp; extensions</text><text x="250" y="251" text-anchor="middle" font-family="Heebo" font-size="14" fill="#12121c">Cookies &amp; logins</text><text x="250" y="296" text-anchor="middle" font-family="Heebo" font-size="14" fill="#12121c">All tabs</text><text x="250" y="366" text-anchor="middle" font-family="Heebo" font-size="16" font-weight="700" fill="#f6f3ea">The page</text><line x1="90" y1="176" x2="128" y2="226" stroke="#6d6d80" stroke-width="1"/><text x="40" y="168" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Brave, August 2025</text><circle cx="600" cy="360" r="105" fill="none" stroke="#12121c" stroke-width="2"/><circle cx="600" cy="360" r="55" fill="#12121c"/><text x="600" y="281" text-anchor="middle" font-family="Heebo" font-size="14" fill="#12121c">Manual logins</text><text x="600" y="356" text-anchor="middle" font-family="Heebo" font-size="14" fill="#f6f3ea">Remote</text><text x="600" y="376" text-anchor="middle" font-family="Heebo" font-size="14" fill="#f6f3ea">browser</text><circle cx="950" cy="360" r="150" fill="none" stroke="#6d6d80" stroke-width="2"/><circle cx="950" cy="360" r="100" fill="none" stroke="#12121c" stroke-width="2"/><circle cx="950" cy="360" r="50" fill="#12121c"/><text x="950" y="236" text-anchor="middle" font-family="Heebo" font-size="14" fill="#12121c">Up to 4,000 apps</text><text x="950" y="286" text-anchor="middle" font-family="Heebo" font-size="13" fill="#12121c">Approved connectors</text><text x="950" y="356" text-anchor="middle" font-family="Heebo" font-size="14" fill="#f6f3ea">Cloud</text><text x="950" y="376" text-anchor="middle" font-family="Heebo" font-size="14" fill="#f6f3ea">computer</text><line x1="40" y1="565" x2="1160" y2="565" stroke="#e4e4dc" stroke-width="1"/><text x="250" y="598" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="26" fill="#12121c">Comet</text><text x="250" y="626" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">Inside your browser</text><text x="600" y="598" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="26" fill="#12121c">ChatGPT agent</text><text x="600" y="626" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">A clean browser at OpenAI</text><text x="950" y="598" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="26" fill="#12121c">OpenAI dots</text><text x="950" y="626" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">Cloud computer, 24/7</text></svg>