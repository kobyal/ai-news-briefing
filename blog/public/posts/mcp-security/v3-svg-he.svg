<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="68" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c" text-anchor="end">השדה command הוא קוד, לא הגדרה</text><text x="1160" y="104" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="end">ב-STDIO מה שכתוב ב-config רץ כתהליך על ה-host. 10 CVEs, 150 מיליון הורדות</text><line x1="40" y1="128" x2="1160" y2="128" stroke="#dcd7c8" stroke-width="1"/><rect x="60" y="150" width="520" height="290" rx="6" fill="#12121c"/><text x="84" y="196" font-family="Heebo" font-size="22" fill="#f6f3ea">{ "mcpServers": {</text><text x="114" y="236" font-family="Heebo" font-size="22" fill="#f6f3ea">"notes": {</text><rect x="132" y="252" width="250" height="34" rx="6" fill="none" stroke="#9be15d" stroke-width="2"/><text x="144" y="276" font-family="Heebo" font-size="22" fill="#9be15d">"command": "npx",</text><text x="144" y="316" font-family="Heebo" font-size="22" fill="#f6f3ea">"args": ["-y", "notes-mcp"]</text><text x="114" y="356" font-family="Heebo" font-size="22" fill="#f6f3ea">}</text><text x="84" y="396" font-family="Heebo" font-size="22" fill="#f6f3ea">} }</text><text x="560" y="424" font-family="Heebo" font-size="15" fill="#6d6d80" text-anchor="end">mcp.json</text><line x1="382" y1="269" x2="720" y2="190" stroke="#12121c" stroke-width="1"/><circle cx="720" cy="190" r="4" fill="#12121c"/><text x="1160" y="186" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c" text-anchor="end">מי יכול לכתוב את השורה הזאת?</text><text x="1160" y="216" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">ב-LangFlow: כל אחד, בלי authentication</text><line x1="470" y1="309" x2="720" y2="292" stroke="#12121c" stroke-width="1"/><circle cx="720" cy="292" r="4" fill="#12121c"/><text x="1160" y="288" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c" text-anchor="end">-y מוריד ומריץ כל חבילה מ-npm</text><text x="1160" y="318" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">אין בשם החבילה מילה שפילטר יתפוס</text><line x1="320" y1="440" x2="320" y2="506" stroke="#12121c" stroke-width="2"/><polygon points="310,500 330,500 320,516" fill="#12121c"/><text x="336" y="482" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="start">spawn</text><rect x="60" y="520" width="520" height="120" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="556" y="566" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">תהליך חדש על ה-host</text><text x="556" y="602" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">עם ה-env של האפליקציה: API keys, DB, cloud</text><rect x="700" y="370" width="460" height="110" rx="6" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><text x="1136" y="414" font-family="Heebo" font-weight="700" font-size="22" fill="#6d6d80" text-anchor="end">פילטר מחרוזות על הקלט</text><text x="1136" y="448" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">Flowise ניסה. החוקרים עקפו.</text><line x1="712" y1="470" x2="1148" y2="380" stroke="#6d6d80" stroke-width="2"/><rect x="700" y="510" width="460" height="130" rx="6" fill="none" stroke="#9be15d" stroke-width="2"/><rect x="1150" y="510" width="10" height="130" fill="#9be15d"/><text x="1128" y="552" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">allowlist לפי שם</text><text x="1128" y="586" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">הקלט בוחר שם, אף פעם לא command</text><text x="1128" y="618" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">המלצת OX: רשימה סגורה או dangerous mode מפורש</text></svg>