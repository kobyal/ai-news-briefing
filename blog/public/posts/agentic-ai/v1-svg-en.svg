<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Who picks the next step, and what it may touch</text><text x="40" y="104" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Agentic starts in only one of the four squares</text><line x1="40" y1="118" x2="1160" y2="118" stroke="#dcd7c8" stroke-width="1"/><rect x="220" y="130" width="440" height="225" rx="6" fill="#5fb7ff" fill-opacity="0.22" stroke="#5fb7ff" stroke-width="2"/><rect x="660" y="130" width="440" height="225" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><rect x="220" y="355" width="440" height="225" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><rect x="660" y="355" width="440" height="225" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><text x="240" y="180" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="30" fill="#12121c">agentic AI</text><text x="240" y="214" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Model picks the step, and can write</text><text x="240" y="270" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">Replit, July 2025: deleted a prod DB</text><text x="240" y="300" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">VulnHunter: proposes code fixes</text><text x="680" y="180" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#12121c">agentic RAG</text><text x="680" y="214" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Model picks, but only reads</text><text x="680" y="270" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">Bayer PRINCE: research, reflect, write</text><text x="240" y="405" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#12121c">Automation</text><text x="240" y="439" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Fixed code that writes and executes</text><text x="240" y="495" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">cron, CI/CD, a migration a developer wrote</text><text x="680" y="405" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#12121c">Query / chatbot</text><text x="680" y="439" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Fixed code that reads</text><text x="680" y="495" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">A SELECT that passed code review</text><text x="50" y="248" text-anchor="start" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">Model</text><text x="50" y="274" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">decides</text><text x="50" y="473" text-anchor="start" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">Code</text><text x="50" y="499" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">decides</text><text x="240" y="615" text-anchor="start" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">Writes and executes</text><text x="680" y="615" text-anchor="start" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">Read only</text><line x1="250" y1="540" x2="250" y2="332" stroke="#12121c" stroke-width="2"/><polygon points="243,342 250,326 257,342" fill="#12121c"/><text x="266" y="560" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">This is where timeouts, scopes and a human gate go</text></svg>