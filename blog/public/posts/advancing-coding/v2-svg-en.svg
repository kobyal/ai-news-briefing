<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="80" y="80" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">Pay for high effort only where it failed</text><text x="80" y="118" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">GPT-6.1 Sol on OpenAI's COBOL migration eval</text><line x1="80" y1="140" x2="1160" y2="140" stroke="#dcd7c8" stroke-width="1"/><text x="80" y="186" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Round 1 · low effort · all cases</text><rect x="225" y="200" width="935" height="64" rx="6" fill="#dcd7c8" stroke="#12121c" stroke-width="2"/><rect x="80" y="200" width="145" height="64" rx="6" fill="#ff7aa8" stroke="#12121c" stroke-width="2"/><text x="245" y="241" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">86.6% pass golden_diff</text><text x="153" y="241" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">13.4%</text><line x1="153" y1="268" x2="153" y2="334" stroke="#12121c" stroke-width="2"/><polygon points="161,332 145,332 153,346" fill="#12121c"/><text x="174" y="312" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Only the failures go to the expensive round</text><line x1="225" y1="264" x2="225" y2="390" stroke="#dcd7c8" stroke-width="1" stroke-dasharray="6 6"/><text x="80" y="376" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Round 2 · high effort · same golden set</text><rect x="103" y="390" width="1057" height="64" rx="6" fill="#dcd7c8" stroke="#12121c" stroke-width="2"/><rect x="80" y="390" width="23" height="64" rx="4" fill="#ff7aa8" stroke="#12121c" stroke-width="2"/><text x="130" y="431" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">97.9% pass</text><text x="112" y="496" text-anchor="start" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">2.1%</text><line x1="92" y1="458" x2="92" y2="530" stroke="#12121c" stroke-width="2"/><polygon points="100,528 84,528 92,542" fill="#12121c"/><rect x="80" y="548" width="340" height="70" rx="6" fill="none" stroke="#ff7aa8" stroke-width="3"/><text x="100" y="591" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Human + system expert</text><text x="1160" y="560" text-anchor="end" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">golden_diff.py exit 0</text><text x="1160" y="592" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">decides who passed. Not the model.</text><line x1="480" y1="612" x2="1160" y2="612" stroke="#dcd7c8" stroke-width="1"/><text x="1160" y="642" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">Source: OpenAI, Oct 20, 2026. GPT-5.6 Sol scored 5.4% on the same eval.</text></svg>