<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="36" fill="#12121c">Where a rule lives decides whether it holds</text><text x="40" y="108" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Each step up depends less on the model remembering</text><line x1="60" y1="600" x2="1140" y2="600" stroke="#dcd7c8" stroke-width="2"/><line x1="120" y1="500" x2="1080" y2="210" stroke="#dcd7c8" stroke-width="1" stroke-dasharray="6 6"/><rect x="80" y="520" width="190" height="80" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="95" y="552" text-anchor="start" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">In someone's head</text><text x="95" y="580" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">Agent can't see it</text><rect x="290" y="450" width="190" height="150" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="305" y="482" text-anchor="start" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">Line in a prompt</text><text x="305" y="510" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Probabilistic compliance</text><rect x="500" y="380" width="190" height="220" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="515" y="412" text-anchor="start" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">Short AGENTS.md</text><text x="515" y="440" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">A map, ~100 lines</text><rect x="710" y="310" width="190" height="290" rx="6" fill="#5fb7ff" stroke="#12121c" stroke-width="2"/><text x="725" y="342" text-anchor="start" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">Linter in CI</text><text x="725" y="370" text-anchor="start" font-family="Heebo" font-size="15" fill="#12121c">Blocks PR + fix hint</text><rect x="920" y="240" width="190" height="360" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="935" y="272" text-anchor="start" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">Background agent</text><text x="935" y="300" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Cleans drift nonstop</text><text x="80" y="300" text-anchor="start" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">OpenAI's first fix:</text><text x="80" y="328" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">Manual cleanup every Friday, 20% of the week</text><line x1="175" y1="342" x2="175" y2="512" stroke="#6d6d80" stroke-width="1"/><circle cx="175" cy="516" r="4" fill="#6d6d80"/><text x="805" y="640" text-anchor="middle" font-family="Heebo" font-size="17" fill="#12121c">This is where it started working</text><line x1="805" y1="622" x2="805" y2="604" stroke="#5fb7ff" stroke-width="2"/><text x="80" y="640" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Source: OpenAI, Augment</text></svg>