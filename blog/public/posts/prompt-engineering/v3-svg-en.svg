<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="90" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c" text-anchor="start">Every decision you don't write down, the agent guesses</text><text x="390" y="210" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Command name</text><text x="530" y="210" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Flags</text><text x="670" y="210" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Which fields</text><text x="810" y="210" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Missing field</text><text x="950" y="210" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Long list</text><text x="1090" y="210" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Full mode</text><line x1="40" y1="250" x2="1150" y2="250" stroke="#dcd7c8" stroke-width="1"/><circle cx="390" cy="320" r="26" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><circle cx="530" cy="320" r="26" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><circle cx="670" cy="320" r="26" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><circle cx="810" cy="320" r="26" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><circle cx="950" cy="320" r="26" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><circle cx="1090" cy="320" r="26" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 6"/><text x="40" y="315" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">Version 1 · 6 words</text><text x="40" y="348" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="start">0 of 6 decisions written</text><line x1="40" y1="395" x2="1150" y2="395" stroke="#dcd7c8" stroke-width="1"/><circle cx="390" cy="460" r="26" fill="#ff7aa8"/><circle cx="530" cy="460" r="26" fill="#ff7aa8"/><circle cx="670" cy="460" r="26" fill="#ff7aa8"/><circle cx="810" cy="460" r="26" fill="#ff7aa8"/><circle cx="950" cy="460" r="26" fill="#ff7aa8"/><circle cx="1090" cy="460" r="26" fill="#ff7aa8"/><path d="M379 461 l8 8 l15 -17" stroke="#12121c" stroke-width="3" fill="none"/><path d="M519 461 l8 8 l15 -17" stroke="#12121c" stroke-width="3" fill="none"/><path d="M659 461 l8 8 l15 -17" stroke="#12121c" stroke-width="3" fill="none"/><path d="M799 461 l8 8 l15 -17" stroke="#12121c" stroke-width="3" fill="none"/><path d="M939 461 l8 8 l15 -17" stroke="#12121c" stroke-width="3" fill="none"/><path d="M1079 461 l8 8 l15 -17" stroke="#12121c" stroke-width="3" fill="none"/><text x="390" y="522" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">card:show</text><text x="530" y="522" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">--board, --list</text><text x="670" y="522" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">5 fields</text><text x="810" y="522" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">Skip the heading</text><text x="950" y="522" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">Truncate after 10</text><text x="1090" y="522" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">--all-details</text><text x="40" y="455" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">Version 2 · ~60 words</text><text x="40" y="488" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="start">6 of 6 decisions written</text><text x="40" y="620" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Version 1 shipped without due date or checklists. Version 2 went into use right away (Michael Heap, March 2026)</text></svg>