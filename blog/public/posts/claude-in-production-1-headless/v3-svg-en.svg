<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#fbfbf9"/><text x="40" y="80" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c" text-anchor="start">The run wasn't slow, it was asleep</text><text x="40" y="118" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="start">Same code, same model, just a laptop on battery</text><line x1="200" y1="200" x2="200" y2="560" stroke="#e4e4dc" stroke-width="1" stroke-dasharray="4 4"/><line x1="858" y1="340" x2="858" y2="560" stroke="#e4e4dc" stroke-width="1" stroke-dasharray="4 4"/><text x="200" y="218" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="start">A normal morning</text><rect x="200" y="235" width="222" height="40" rx="6" fill="#12121c"/><text x="440" y="262" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Finishes 06:40–06:55</text><text x="200" y="358" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="start">The morning the Mac fell asleep</text><rect x="200" y="375" width="8" height="40" rx="2" fill="#8b83ff"/><rect x="212" y="375" width="642" height="40" rx="6" fill="none" stroke="#8b83ff" stroke-width="2" stroke-dasharray="8 6"/><text x="533" y="402" font-family="Heebo" font-size="19" fill="#8b83ff" text-anchor="middle">Run frozen, nobody noticed</text><rect x="858" y="375" width="216" height="40" rx="6" fill="#12121c"/><line x1="208" y1="415" x2="208" y2="470" stroke="#12121c" stroke-width="1"/><text x="216" y="490" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="start">Mac asleep after 43 seconds</text><text x="216" y="514" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="start">120-second sleep timer, on battery</text><line x1="858" y1="415" x2="858" y2="470" stroke="#12121c" stroke-width="1"/><text x="866" y="490" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="start">Resumes only around 08:00</text><text x="866" y="514" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="start">About 2.5 hours end to end</text><line x1="160" y1="560" x2="1120" y2="560" stroke="#e4e4dc" stroke-width="2"/><line x1="160" y1="554" x2="160" y2="566" stroke="#6d6d80" stroke-width="1"/><line x1="335" y1="554" x2="335" y2="566" stroke="#6d6d80" stroke-width="1"/><line x1="509" y1="554" x2="509" y2="566" stroke="#6d6d80" stroke-width="1"/><line x1="684" y1="554" x2="684" y2="566" stroke="#6d6d80" stroke-width="1"/><line x1="858" y1="554" x2="858" y2="566" stroke="#6d6d80" stroke-width="1"/><line x1="1033" y1="554" x2="1033" y2="566" stroke="#6d6d80" stroke-width="1"/><text x="160" y="590" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">06:00</text><text x="335" y="590" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">06:30</text><text x="509" y="590" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">07:00</text><text x="684" y="590" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">07:30</text><text x="858" y="590" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">08:00</text><text x="1033" y="590" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">08:30</text><circle cx="200" cy="560" r="7" fill="#8b83ff"/><text x="200" y="622" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">cron 06:07</text><text x="40" y="650" font-family="Heebo" font-size="18" fill="#8b83ff" text-anchor="start">The fix: keep the machine awake</text></svg>