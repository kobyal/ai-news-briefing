<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#fbfbf9"/><text x="600" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="middle">Plain RAG retrieves the average. An agent searches three times</text><text x="600" y="100" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">The MLM example: Q3 2025 vs Q1 2026 sales, plus risk factors from the latest SEC filing</text><circle cx="250" cy="260" r="70" fill="none" stroke="#e4e4dc" stroke-width="2"/><circle cx="225" cy="245" r="7" fill="#6d6d80"/><circle cx="270" cy="240" r="7" fill="#6d6d80"/><circle cx="250" cy="285" r="7" fill="#6d6d80"/><text x="250" y="175" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Q3 2025 sales</text><circle cx="950" cy="260" r="70" fill="none" stroke="#e4e4dc" stroke-width="2"/><circle cx="925" cy="250" r="7" fill="#6d6d80"/><circle cx="975" cy="245" r="7" fill="#6d6d80"/><circle cx="955" cy="290" r="7" fill="#6d6d80"/><text x="950" y="175" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Q1 2026 sales</text><circle cx="600" cy="545" r="70" fill="none" stroke="#e4e4dc" stroke-width="2"/><circle cx="575" cy="535" r="7" fill="#6d6d80"/><circle cx="625" cy="530" r="7" fill="#6d6d80"/><circle cx="605" cy="575" r="7" fill="#6d6d80"/><text x="600" y="645" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Risk factors in the SEC filing</text><circle cx="600" cy="355" r="55" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 6"/><circle cx="600" cy="362" r="8" fill="#12121c"/><text x="600" y="338" font-family="Heebo" font-size="16" fill="#12121c" text-anchor="middle">one question</text><line x1="555" y1="385" x2="460" y2="425" stroke="#6d6d80" stroke-width="1"/><text x="360" y="447" font-family="Heebo" font-size="18" font-weight="700" fill="#12121c" text-anchor="middle">Plain RAG only looks here:</text><text x="360" y="474" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">near the average, far from all three</text><line x1="542" y1="339" x2="336" y2="284" stroke="#5fb7ff" stroke-width="3"/><polygon points="322,280 337,277 334,290" fill="#5fb7ff"/><line x1="658" y1="339" x2="864" y2="284" stroke="#5fb7ff" stroke-width="3"/><polygon points="878,280 866,290 863,277" fill="#5fb7ff"/><line x1="600" y1="418" x2="600" y2="458" stroke="#5fb7ff" stroke-width="3"/><polygon points="600,472 593,457 607,457" fill="#5fb7ff"/><text x="430" y="292" font-family="Heebo" font-size="17" font-weight="700" fill="#5fb7ff" text-anchor="middle">search 1</text><text x="770" y="292" font-family="Heebo" font-size="17" font-weight="700" fill="#5fb7ff" text-anchor="middle">search 2</text><text x="660" y="452" font-family="Heebo" font-size="17" font-weight="700" fill="#5fb7ff" text-anchor="middle">search 3</text><text x="1000" y="650" font-family="Heebo" font-size="14" fill="#6d6d80" text-anchor="middle">Source: Machine Learning Mastery</text></svg>