t-size="18" fill="#12121c">Your request</text><text x="1120" y="527" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">the small part</text><path d="M580 200 H500 V368 M580 368 H500 M500 280 H440" fill="none" stroke="#12121c" stroke-width="2"/><rect x="40" y="230" width="400" height="100" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="60" y="272" text-anchor="start" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c">Model stops to reconcile</text><text x="60" y="308" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">before it does the actual work</text><text x="40" y="400" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">System prompt, before</text><rect x="40" y="412" width="400" height="28" rx="6" fill="#12121c"/><text x="40" y="478" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">After, on Opus 5 and Fable 5</text><rect x="40" y="490" width="76" height="28" rx="6" fill="#9be15d" stroke="#12121c" stroke-width="2"/><text x="130" y="511" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">under 20%</text><text x="40" y="570" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Measurable drop in coding evals: none</text><line x1="40" y1="600" x2="1160" y2="600" stroke="#dcd7c8" stroke-width="1"/><text x="1140" y="635" text-anchor="end" font-family="Heebo" font-size="15" fill="#6d6d80">Source: Claude blog, July 24, 2026</text></svg>