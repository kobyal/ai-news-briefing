<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="64" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Same agent, two architectures</text><line x1="560" y1="95" x2="620" y2="600" stroke="#dcd7c8" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="140" text-anchor="start" font-family="Heebo" font-size="22" fill="#6d6d80">Before · Replit, July 2025</text><rect x="60" y="170" width="260" height="70" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="190" y="213" text-anchor="middle" font-family="Heebo" font-size="24" fill="#12121c">agent</text><line x1="190" y1="240" x2="190" y2="465" stroke="#ffb454" stroke-width="5"/><polygon points="204,462 176,462 190,484" fill="#ffb454"/><text x="205" y="425" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">direct DELETE</text><rect x="360" y="280" width="170" height="80" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><text x="370" y="312" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">In the prompt:</text><text x="370" y="342" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">code freeze ×11</text><text x="360" y="388" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">text, not a permission</text><line x1="360" y1="290" x2="322" y2="228" stroke="#6d6d80" stroke-width="1"/><rect x="60" y="485" width="260" height="80" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="190" y="520" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">prod DB</text><text x="190" y="550" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">1,206 execs · 1,196 companies</text><text x="660" y="140" text-anchor="start" font-family="Heebo" font-size="22" fill="#6d6d80">After · what Replit added</text><rect x="860" y="170" width="260" height="70" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="990" y="213" text-anchor="middle" font-family="Heebo" font-size="24" fill="#12121c">agent</text><line x1="990" y1="240" x2="990" y2="292" stroke="#12121c" stroke-width="2"/><polygon points="1000,290 980,290 990,306" fill="#12121c"/><rect x="860" y="306" width="260" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="990" y="343" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">dev DB</text><line x1="990" y1="366" x2="990" y2="392" stroke="#6d6d80" stroke-width="1" stroke-dasharray="4 4"/><rect x="840" y="394" width="300" height="12" rx="6" fill="#ffb454"/><text x="655" y="398" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">role: read-only</text><text x="655" y="428" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">restore: backup + human</text><rect x="860" y="485" width="260" height="80" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="990" y="520" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">prod DB</text><text x="990" y="550" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">one-click restore</text><text x="40" y="640" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">The instruction reached the model. The DELETE ran in the harness. Only the right side has something to stop it.</text></svg>