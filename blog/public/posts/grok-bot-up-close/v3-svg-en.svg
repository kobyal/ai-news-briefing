<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="start">One computer for every bot, or one computer per bot</text><line x1="600" y1="110" x2="600" y2="630" stroke="#e4e4dc" stroke-width="2"/><text x="40" y="140" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="start">Grok Bot</text><text x="40" y="172" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Every bot on the account shares one cloud computer</text><line x1="500" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="420" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="340" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="260" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="180" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="100" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><circle cx="500" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="420" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="340" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="260" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="180" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="100" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><rect x="60" y="330" width="480" height="160" rx="6" fill="#3ecfb2" fill-opacity="0.18" stroke="#3ecfb2" stroke-width="2"/><text x="300" y="392" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c" text-anchor="middle">cloud computer</text><text x="300" y="432" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">cookies · saved logins · files · terminal</text><text x="40" y="550" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="start">One Gmail session, six bots holding it</text><text x="40" y="585" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Deleting a bot doesn't delete sessions or files (FAQ)</text><text x="640" y="140" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="start">Errand · open-source</text><text x="640" y="172" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Isolated runtime per teammate: shell, browser, fs</text><line x1="1070" y1="264" x2="1070" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="900" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="730" y1="264" x2="730" y2="330" stroke="#6d6d80" stroke-width="1"/><circle cx="1070" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="900" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="730" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><rect x="1000" y="330" width="140" height="160" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="830" y="330" width="140" height="160" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="660" y="330" width="140" height="160" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="1070" y="418" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">runtime</text><text x="900" y="418" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">runtime</text><text x="730" y="418" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">runtime</text><text x="640" y="550" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="start">4,000 lines of TypeScript, built in a week</text><text x="640" y="585" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">The boundary is the bot, and you own the infra</text></svg>