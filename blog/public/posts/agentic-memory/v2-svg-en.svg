<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">200K tokens, and U-shaped attention</text><text x="40" y="108" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">How much the model sees of each part of the context (Liu et al., 2023)</text><line x1="120" y1="260" x2="1100" y2="260" stroke="#dcd7c8" stroke-width="1"/><line x1="120" y1="360" x2="1100" y2="360" stroke="#dcd7c8" stroke-width="1"/><line x1="120" y1="460" x2="1100" y2="460" stroke="#dcd7c8" stroke-width="1"/><line x1="120" y1="560" x2="1100" y2="560" stroke="#12121c" stroke-width="2"/><line x1="120" y1="160" x2="120" y2="560" stroke="#12121c" stroke-width="2"/><text x="135" y="155" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">high attention</text><path d="M140 200 C 300 500, 920 500, 1080 190" fill="none" stroke="#12121c" stroke-width="3"/><circle cx="140" cy="200" r="9" fill="#12121c"/><circle cx="1080" cy="190" r="9" fill="#12121c"/><text x="160" y="196" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">system prompt</text><text x="160" y="224" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">read well</text><text x="1060" y="186" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">latest message</text><text x="1060" y="214" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">read well</text><line x1="610" y1="412" x2="610" y2="262" stroke="#12121c" stroke-width="1"/><rect x="410" y="196" width="400" height="66" rx="6" fill="#f6f3ea" stroke="#9be15d" stroke-width="3"/><text x="610" y="238" text-anchor="middle" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">always format dates as YYYY-MM-DD</text><circle cx="610" cy="424" r="13" fill="#9be15d" stroke="#12121c" stroke-width="2"/><text x="380" y="512" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">What was decided mid-run sits here</text><text x="380" y="540" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">An hour every 4 hours, and the history only grows</text><text x="120" y="592" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">0</text><text x="1100" y="592" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">200K</text><text x="1100" y="630" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">position in context</text><text x="120" y="630" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">The fix: move the rule into a file that always loads first</text></svg>