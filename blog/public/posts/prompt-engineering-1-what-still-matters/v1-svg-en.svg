<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="40" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Half of a 2023 prompt is now written in code</text><text x="40" y="98" font-family="Heebo" font-size="18" fill="#6d6d80">Line by line: what died, what moved to the harness, and what stayed</text><rect x="40" y="140" width="500" height="480" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="60" y="174" font-family="Heebo" font-size="16" fill="#6d6d80">a typical prompt, 2023</text><line x1="60" y1="190" x2="520" y2="190" stroke="#e4e4dc" stroke-width="1"/><text x="60" y="240" font-family="Heebo" font-size="22" fill="#6d6d80">You are a world-class expert in X</text><line x1="55" y1="233" x2="395" y2="233" stroke="#12121c" stroke-width="2"/><text x="520" y="262" font-family="Heebo" font-size="15" fill="#6d6d80" text-anchor="end">dead · the model does it</text><text x="60" y="300" font-family="Heebo" font-size="22" fill="#6d6d80">Think step by step</text><line x1="55" y1="293" x2="250" y2="293" stroke="#12121c" stroke-width="2"/><text x="520" y="300" font-family="Heebo" font-size="15" fill="#6d6d80" text-anchor="end">dead · reasoning models</text><text x="60" y="365" font-family="Heebo" font-size="22" fill="#6d6d80">Return JSON only, no explanations</text><text x="60" y="430" font-family="Heebo" font-size="22" fill="#6d6d80">Here's the whole debug log…</text><text x="60" y="495" font-family="Heebo" font-size="22" fill="#6d6d80">Make sure the code works</text><rect x="60" y="540" width="460" height="60" rx="6" fill="#ffb454"/><text x="80" y="578" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">What I actually want, and where to stop</text><text x="40" y="652" font-family="Heebo" font-size="16" fill="#6d6d80">Stays in the prompt: intent</text><text x="720" y="174" font-family="Heebo" font-size="16" fill="#6d6d80">harness · code</text><rect x="720" y="200" width="440" height="90" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="740" y="238" font-family="Heebo" font-weight="700" font-size="21" fill="#12121c">Structured Outputs</text><text x="740" y="268" font-family="Heebo" font-size="16" fill="#6d6d80">format and parsing in code, not wording</text><rect x="720" y="310" width="440" height="90" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="740" y="348" font-family="Heebo" font-weight="700" font-size="21" fill="#12121c">context engineering</text><text x="740" y="378" font-family="Heebo" font-size="16" fill="#6d6d80">one debug session burns tens of thousands of tokens</text><rect x="720" y="420" width="440" height="90" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="740" y="458" font-family="Heebo" font-weight="700" font-size="21" fill="#12121c">pass / fail check</text><text x="740" y="488" font-family="Heebo" font-size="16" fill="#6d6d80">tests · exit code · linter · diff</text><path d="M520 358 C620 358 620 245 702 245" fill="none" stroke="#6d6d80" stroke-width="2"/><polygon points="716,245 702,238 702,252" fill="#6d6d80"/><path d="M520 423 C620 423 620 355 702 355" fill="none" stroke="#6d6d80" stroke-width="2"/><polygon points="716,355 702,348 702,362" fill="#6d6d80"/><path d="M520 488 C620 488 620 465 702 465" fill="none" stroke="#6d6d80" stroke-width="2"/><polygon points="716,465 702,458 702,472" fill="#6d6d80"/><line x1="720" y1="545" x2="1160" y2="545" stroke="#e4e4dc" stroke-width="1"/><text x="720" y="585" font-family="Heebo" font-size="20" fill="#12121c">3 lines moved to code · 2 died · 1 stayed</text></svg>