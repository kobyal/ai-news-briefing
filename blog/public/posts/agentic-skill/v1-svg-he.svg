<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="70" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">מה נכנס ל-context בכל קריאה</text><text x="1160" y="106" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">אותם כללים, שתי דרכים לשים אותם</text><text x="1160" y="160" text-anchor="end" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">הכל ב-system prompt</text><rect x="410" y="175" width="750" height="50" rx="6" fill="#12121c"/><text x="1160" y="255" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">5,000 טוקנים בכל קריאה, גם כשהמשימה לא קשורה</text><text x="1160" y="310" text-anchor="end" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">20 skills, שאלה רגילה</text><rect x="860" y="325" width="300" height="50" rx="6" fill="#8b83ff"/><line x1="860" y1="350" x2="1160" y2="350" stroke="#f6f3ea" stroke-width="50" stroke-dasharray="1 14"/><text x="1160" y="405" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">~100 טוקנים ל-skill × 20 = ~2,000. רק name ו-description</text><text x="1160" y="460" text-anchor="end" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">20 skills, משימת migration</text><rect x="860" y="475" width="300" height="50" rx="6" fill="#8b83ff"/><line x1="860" y1="500" x2="1160" y2="500" stroke="#f6f3ea" stroke-width="50" stroke-dasharray="1 14"/><rect x="766" y="475" width="90" height="50" rx="6" fill="none" stroke="#8b83ff" stroke-width="2"/><text x="811" y="506" text-anchor="middle" font-family="Heebo" font-size="16" fill="#12121c">גוף</text><rect x="754" y="475" width="8" height="50" rx="2" fill="#6d6d80"/><line x1="758" y1="470" x2="705" y2="440" stroke="#6d6d80" stroke-width="1"/><text x="698" y="444" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">פלט ה-script בלבד</text><text x="1160" y="555" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">+ גוף אחד (~600 טוקנים) רק כשהמשימה מתאימה. הקוד של ה-script לא נכנס</text><line x1="410" y1="600" x2="1160" y2="600" stroke="#dcd7c8" stroke-width="1"/><line x1="1160" y1="594" x2="1160" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="1010" y1="594" x2="1010" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="860" y1="594" x2="860" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="710" y1="594" x2="710" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="560" y1="594" x2="560" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="410" y1="594" x2="410" y2="606" stroke="#dcd7c8" stroke-width="1"/><text x="1155" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">0</text><text x="1010" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">1,000</text><text x="860" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">2,000</text><text x="710" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">3,000</text><text x="560" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">4,000</text><text x="410" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">5,000</text><text x="380" y="605" text-anchor="end" font-family="Heebo" font-size="16" fill="#6d6d80">טוקנים</text><text x="40" y="660" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">מקורות: התיעוד של אנטרופיק ל-Agent Skills · dev.to (prompt שגדל מ-200 ל-5,000)</text></svg>