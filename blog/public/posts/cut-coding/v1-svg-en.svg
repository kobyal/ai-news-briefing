<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="50" y="78" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c" text-anchor="start">Where to cut: two steps stay with the model</text><text x="50" y="116" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="start">Vivek Haldar's workflow, from a natural-language skill to a Python harness</text><line x1="50" y1="140" x2="1150" y2="140" stroke="#dcd7c8" stroke-width="1"/><text x="50" y="180" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="start">Before: everything goes through the model</text><rect x="50" y="200" width="1100" height="90" rx="6" fill="#9be15d" fill-opacity="0.4" stroke="#12121c" stroke-width="2"/><text x="600" y="253" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="middle">Natural-language SKILL.md, reinterpreted on every run</text><text x="50" y="405" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="start">After: Python runs five steps, the model handles two</text><rect x="50" y="430" width="140" height="100" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="120" y="487" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Fetch sources</text><rect x="210" y="430" width="140" height="100" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="280" y="487" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Build inventory</text><rect x="370" y="430" width="140" height="100" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="440" y="487" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Recent posts</text><rect x="530" y="430" width="140" height="100" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="600" y="487" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Filter</text><rect x="690" y="430" width="140" height="100" rx="6" fill="#9be15d" stroke="#12121c" stroke-width="2"/><text x="760" y="487" font-family="Heebo" font-weight="700" font-size="17" fill="#12121c" text-anchor="middle">Pick candidate</text><rect x="850" y="430" width="140" height="100" rx="6" fill="#9be15d" stroke="#12121c" stroke-width="2"/><text x="920" y="487" font-family="Heebo" font-weight="700" font-size="17" fill="#12121c" text-anchor="middle">Write draft</text><rect x="1010" y="430" width="140" height="100" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="1080" y="487" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Save state</text><line x1="680" y1="190" x2="680" y2="550" stroke="#12121c" stroke-width="2" stroke-dasharray="10 8"/><line x1="1000" y1="190" x2="1000" y2="550" stroke="#12121c" stroke-width="2" stroke-dasharray="10 8"/><line x1="50" y1="575" x2="1150" y2="575" stroke="#dcd7c8" stroke-width="1"/><text x="50" y="645" font-family="Frank Ruhl Libre" font-weight="700" font-size="60" fill="#12121c" text-anchor="start">94%</text><text x="210" y="622" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">fewer tokens per run after the cut</text><text x="210" y="652" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Vivek Haldar, compiling an agent skill</text></svg>