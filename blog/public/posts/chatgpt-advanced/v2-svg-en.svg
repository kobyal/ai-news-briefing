<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="start">What the model sees before you type a word</text><text x="40" y="96" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Context layers in ChatGPT, from fixed to temporary</text><text x="1140" y="116" font-family="Heebo" font-size="15" fill="#6d6d80" text-anchor="end">Scope</text><line x1="910" y1="125" x2="910" y2="509" stroke="#e4e4dc" stroke-width="1"/><rect x="40" y="125" width="840" height="64" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="70" y="165" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">Custom instructions</text><text x="850" y="164" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">You write · 1,500 chars per field</text><text x="1140" y="163" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">Every chat</text><rect x="40" y="205" width="840" height="64" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="70" y="245" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">Memory</text><text x="850" y="244" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">The model picks · clean monthly</text><text x="1140" y="243" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">Every chat</text><rect x="40" y="285" width="840" height="64" rx="6" fill="#3ecfb2" stroke="#12121c" stroke-width="2"/><text x="70" y="325" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c" text-anchor="start">Project</text><text x="850" y="324" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="end">Instructions + files · a snapshot that doesn't update</text><text x="1140" y="323" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">Inside the project</text><rect x="40" y="365" width="840" height="64" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="70" y="405" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">Connectors / MCP</text><text x="850" y="404" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">Gmail, GitHub, SharePoint · read-only first</text><text x="1140" y="403" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">Per permission</text><rect x="40" y="445" width="840" height="64" rx="6" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="8 6"/><text x="70" y="485" font-family="Heebo" font-size="24" fill="#12121c" text-anchor="start">The current chat</text><text x="850" y="484" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">The longer it runs, the more it drifts</text><text x="1140" y="483" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">Now</text><line x1="310" y1="512" x2="310" y2="548" stroke="#12121c" stroke-width="2"/><polygon points="320,546 300,546 310,560" fill="#12121c"/><rect x="40" y="564" width="540" height="60" rx="6" fill="none" stroke="#3ecfb2" stroke-width="2"/><text x="70" y="602" font-family="Heebo" font-size="22" fill="#12121c" text-anchor="start">Your prompt: the thinnest layer</text><text x="1140" y="602" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">Most of the impact sits above the dashed line</text></svg>