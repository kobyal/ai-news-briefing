<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#fbfbf9"/><text x="600" y="58" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="middle">A small core, a big fence</text><text x="600" y="92" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">The Show HN LangGraph project, under 512MB RAM, and what each part does</text><rect x="90" y="120" width="1020" height="520" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="8 6"/><rect x="130" y="145" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="260" y="178" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">Classifier</text><text x="260" y="205" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">sorts into 5 intents</text><rect x="470" y="145" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="600" y="178" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">CrossQuestioner</text><text x="600" y="205" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">clarifies, 2 rounds max</text><rect x="810" y="145" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="940" y="178" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">Cohere reranker</text><text x="940" y="205" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">keeps 10 of 100+ chunks</text><rect x="130" y="345" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="260" y="378" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">Human approval</text><text x="260" y="405" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">before Tavily web search</text><rect x="810" y="345" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="940" y="378" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">Redis cache</text><text x="940" y="405" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">one-hour expiry</text><rect x="130" y="540" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="260" y="573" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">Hallucination Guard</text><text x="260" y="600" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">below 40% confidence: rejected</text><rect x="470" y="540" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="600" y="573" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">Circuit breaker</text><text x="600" y="600" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">3 API failures: circuit opens</text><rect x="810" y="540" width="260" height="80" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="940" y="573" font-family="Heebo" font-size="20" font-weight="700" fill="#12121c" text-anchor="middle">PII Shield</text><text x="940" y="600" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">filters personal data</text><rect x="430" y="290" width="340" height="180" rx="6" fill="#fbfbf9" stroke="#5fb7ff" stroke-width="3"/><text x="600" y="334" font-family="Frank Ruhl Libre" font-weight="700" font-size="24" fill="#5fb7ff" text-anchor="middle">The agentic part</text><text x="600" y="374" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">Retriever over Pinecone</text><text x="600" y="408" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">tool calling for stock prices</text><text x="600" y="442" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">deciding to go to the web</text></svg>