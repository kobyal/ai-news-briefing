<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#fbfbf9"/><text x="1160" y="80" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c" text-anchor="end">הריצה לא הייתה איטית, היא ישנה</text><text x="1160" y="118" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="end">אותו קוד, אותו מודל, רק מחשב על סוללה</text><line x1="200" y1="200" x2="200" y2="560" stroke="#e4e4dc" stroke-width="1" stroke-dasharray="4 4"/><line x1="858" y1="340" x2="858" y2="560" stroke="#e4e4dc" stroke-width="1" stroke-dasharray="4 4"/><text x="1160" y="218" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">בוקר רגיל</text><rect x="200" y="235" width="222" height="40" rx="6" fill="#12121c"/><text x="440" y="262" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">מסתיים 06:40–06:55</text><text x="1160" y="358" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">הבוקר שהמק נרדם</text><rect x="200" y="375" width="8" height="40" rx="2" fill="#8b83ff"/><rect x="212" y="375" width="642" height="40" rx="6" fill="none" stroke="#8b83ff" stroke-width="2" stroke-dasharray="8 6"/><text x="533" y="402" font-family="Heebo" font-size="19" fill="#8b83ff" text-anchor="middle">הריצה קפואה, אף אחד לא שם לב</text><rect x="858" y="375" width="216" height="40" rx="6" fill="#12121c"/><line x1="208" y1="415" x2="208" y2="470" stroke="#12121c" stroke-width="1"/><text x="216" y="490" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="start">המק נרדם אחרי 43 שניות</text><text x="216" y="514" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="start">טיימר שינה של 120 שניות, על סוללה</text><line x1="858" y1="415" x2="858" y2="470" stroke="#12121c" stroke-width="1"/><text x="1074" y="490" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">רק בסביבות 08:00 ממשיכים</text><t