<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">Four gates between the agent and main</text><text x="40" y="116" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Each gate is a file or a command. None of them is a request in a prompt</text><line x1="40" y1="150" x2="1160" y2="150" stroke="#dcd7c8" stroke-width="1"/><rect x="60" y="290" width="150" height="80" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="135" y="324" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">agent</text><text x="76" y="352" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">a diff in 10 min</text><rect x="970" y="290" width="170" height="80" rx="6" fill="#ffb454" stroke="#12121c" stroke-width="2"/><text x="1055" y="338" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">main</text><line x1="210" y1="330" x2="316" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="328,330 316,324 316,336" fill="#12121c"/><line x1="350" y1="330" x2="486" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="498,330 486,324 486,336" fill="#12121c"/><line x1="520" y1="330" x2="656" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="668,330 656,324 656,336" fill="#12121c"/><line x1="690" y1="330" x2="826" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="838,330 826,324 826,336" fill="#12121c"/><line x1="860" y1="330" x2="954" y2="330" stroke="#12121c" stroke-width="2"/><polygon points="966,330 954,324 954,336" fill="#12121c"/><rect x="330" y="250" width="20" height="160" rx="3" fill="#12121c"/><rect x="500" y="250" width="20" height="160" rx="3" fill="#12121c"/><rect x="670" y="250" width="20" height="160" rx="3" fill="#12121c"/><rect x="840" y="250" width="20" height="160" rx="3" fill="#12121c"/><text x="340" y="234" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="17" fill="#12121c">permissions</text><text x="510" y="234" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="17" fill="#12121c">npm test</text><text x="680" y="234" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="17" fill="#12121c">diff size</text><text x="850" y="234" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="17" fill="#12121c">review</text><text x="268" y="446" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Blocks .env, git push</text><text x="448" y="446" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Red test: back</text><text x="610" y="446" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Over 400 lines: back</text><text x="776" y="446" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">A human reads the diff</text><line x1="340" y1="464" x2="340" y2="530" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><line x1="510" y1="464" x2="510" y2="530" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><line x1="680" y1="464" x2="680" y2="530" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><line x1="850" y1="464" x2="850" y2="530" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><line x1="850" y1="530" x2="135" y2="530" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><line x1="135" y1="530" x2="135" y2="386" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 5"/><polygon points="135,372 129,386 141,386" fill="#6d6d80"/><text x="240" y="566" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">Rejected? Back to the agent with a note. Never straight to main</text><line x1="40" y1="596" x2="1160" y2="596" stroke="#dcd7c8" stroke-width="1"/><rect x="40" y="612" width="16" height="16" rx="3" fill="#ffb454"/><text x="68" y="626" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">Replit, July 2025: an agent with production DB access and zero gates. More than 1,200 records deleted</text></svg>