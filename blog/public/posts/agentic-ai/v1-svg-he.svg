<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="70" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">מי בוחר את הצעד הבא, ומה מותר לו לגעת</text><text x="1160" y="104" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">agentic מתחיל רק בריבוע אחד מתוך ארבעה</text><line x1="40" y1="118" x2="1160" y2="118" stroke="#dcd7c8" stroke-width="1"/><rect x="220" y="130" width="440" height="225" rx="6" fill="#5fb7ff" fill-opacity="0.22" stroke="#5fb7ff" stroke-width="2"/><rect x="660" y="130" width="440" height="225" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><rect x="220" y="355" width="440" height="225" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><rect x="660" y="355" width="440" height="225" rx="6" fill="none" stroke="#dcd7c8" stroke-width="2"/><text x="640" y="180" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="30" fill="#12121c">agentic AI</text><text x="640" y="214" text-anchor="end" font-family="Heebo" font-size="19" fill="#12121c">המודל בוחר את הצעד, ויש לו הרשאת כתיבה</text><text x="640" y="270" text-anchor="end" font-family="Heebo" font-size="17" fill="#6d6d80">Replit, יולי 2025: מחק DB של פרודקשן</text><text x="640" y="300" text-anchor="end" font-family="Heebo" font-size="17" fill="#6d6d80">VulnHunter: מציע תיקונים בקוד</text><text x="1080" y="180" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#12121c">agentic RAG</text><text x="1080" y="214" text-anchor="end" font-family="Heebo" font-size="19" fill="#12121c">המודל בוחר, אבל רק קורא</text><text x="1080" y="270" text-anchor="end" font-family="Heebo" font-size="17" fill="#6d6d80">Bayer PRINCE: מחקר, רפלקציה, כתיבה</text><text x="640" y="405" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#12121c">אוטומציה</text><text x="640" y="439" text-anchor="end" font-family="Heebo" font-size="19" fill="#12121c">קוד קבוע שכותב ומבצע</text><text x="640" y="495" text-anchor="end" font-family="Heebo" font-size="17" fill="#6d6d80">cron, CI/CD, migration שמפתח כתב</text><text x="1080" y="405" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#12121c">שאילתה / צ׳אטבוט</text><text x="1080" y="439" text-anchor="end" font-family="Heebo" font-size="19" fill="#12121c">קוד קבוע שקורא</text><text x="1080" y="495" text-anchor="end" font-family="Heebo" font-size="17" fill="#6d6d80">SELECT שעבר code review</text><text x="200" y="248" text-anchor="end" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">המודל</text><text x="200" y="274" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">מחליט</text><text x="200" y="473" text-anchor="end" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">הקוד</text><text x="200" y="499" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">מחליט</text><text x="640" y="615" text-anchor="end" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">כותב ומבצע</text><text x="1080" y="615" text-anchor="end" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">קורא בלבד</text><line x1="250" y1="540" x2="250" y2="332" stroke="#12121c" stroke-width="2"/><polygon points="243,342 250,326 257,342" fill="#12121c"/><text x="266" y="560" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">כאן נכנסים timeouts, scopes ושער אנושי</text></svg>