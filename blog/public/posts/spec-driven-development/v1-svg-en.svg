ct x="270" y="232" width="120" height="56" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="330" y="268" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">A · v1</text><text x="330" y="320" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">R1</text><path d="M390 282 C 450 310, 460 410, 498 440" stroke="#6d6d80" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="500" y="422" width="120" height="56" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="560" y="458" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">A · v1</text><text x="560" y="512" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">R3: delete = move to trash</text><rect x="730" y="232" width="120" height="56" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="790" y="268" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">A · v2</text><text x="790" y="320" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">R2 passes: name is free</text><rect x="925" y="190" width="190" height="135" rx="10" fill="#3ecfb2" fill-opacity="0.15" stroke="#3ecfb2" stroke-width="2"/><rect x="940" y="205" width="160" height="44" rx="6" fill="#f6f3ea" stroke="#3ecfb2" stroke-width="2"/><text x="1020" y="235" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">A · v1</text><rect x="940" y="266" width="160" height="44" rx="6" fill="#f6f3ea" stroke="#3ecfb2" stroke-width="2"/><text x="1020" y="296" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">A · v2</text><path d="M622 452 C 820 470, 960 420, 1000 330" stroke="#3ecfb2" stroke-width="2" fill="none" marker-end="url(#ahx)"/><text x="1020" y="362" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">R4 vs R2</text><text x="1020" y="388" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">Two documents named A</text><line x1="40" y1="565" x2="1160" y2="565" stroke="#dcd7c8" stroke-width="1"/><text x="40" y="605" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">A model checker finds this in seconds. Code review, usually, doesn't.</text><text x="40" y="638" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">v1: R1 and R2. v2: one line changed (R3), one line added (R4). Source: blog.fizzbee.ai</text></svg>