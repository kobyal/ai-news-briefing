ols</text><text x="720" y="185">Context mgmt</text><text x="940" y="185">Hooks</text><text x="250" y="377">Sandbox</text><text x="950" y="377">Subagents</text><text x="280" y="565">Checks</text><text x="500" y="565">Failure recovery</text><text x="720" y="565">State across runs</text><text x="940" y="565">Permissions</text></g><rect x="520" y="320" width="160" height="100" rx="6" fill="#12121c"/><text x="600" y="380" font-family="Frank Ruhl Libre" font-weight="700" font-size="28" fill="#fbfbf9" text-anchor="middle">Model</text><text x="280" y="256" font-family="Heebo" font-size="16" fill="#12121c" text-anchor="middle">one component of ten</text><line x1="205" y1="266" x2="355" y2="266" stroke="#5fb7ff" stroke-width="2"/></svg>