<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Codex vs Claude Code: which way each row leans</text><text x="40" y="104" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">The dot shows which tool is stronger on each row, based on what the vendors publish</text><text x="1080" y="150" text-anchor="end" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">Claude Code</text><text x="380" y="150" text-anchor="start" font-family="Heebo" font-weight="700" font-size="20" fill="#3ecfb2">Codex</text><line x1="730" y1="135" x2="730" y2="600" stroke="#6d6d80" stroke-width="1" stroke-dasharray="4 6"/><line x1="380" y1="190" x2="1080" y2="190" stroke="#e4e4dc" stroke-width="2"/><circle cx="440" cy="190" r="11" fill="#3ecfb2"/><text x="40" y="196" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Runs with laptop closed</text><text x="40" y="218" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Cloud per repo + mobile since May 14</text><line x1="380" y1="255" x2="1080" y2="255" stroke="#e4e4dc" stroke-width="2"/><circle cx="470" cy="255" r="11" fill="#3ecfb2"/><text x="40" y="261" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Sandbox by default</text><text x="40" y="283" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">workspace-write, no network</text><line x1="380" y1="320" x2="1080" y2="320" stroke="#e4e4dc" stroke-width="2"/><circle cx="400" cy="320" r="11" fill="#3ecfb2"/><text x="40" y="326" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Open-source CLI</text><text x="40" y="348" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Apache 2.0, on GitHub</text><line x1="380" y1="385" x2="1080" y2="385" stroke="#e4e4dc" stroke-width="2"/><circle cx="460" cy="385" r="11" fill="#3ecfb2"/><text x="40" y="391" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Fast model, small edits</text><text x="40" y="413" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Spark: 1,000+ tokens per second</text><line x1="380" y1="450" x2="1080" y2="450" stroke="#e4e4dc" stroke-width="2"/><circle cx="1010" cy="450" r="11" fill="#12121c"/><text x="40" y="456" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Loop control (hooks)</text><text x="40" y="478" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Before and after every tool</text><line x1="380" y1="515" x2="1080" y2="515" stroke="#e4e4dc" stroke-width="2"/><circle cx="970" cy="515" r="11" fill="#12121c"/><text x="40" y="521" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Subagents, fine permissions</text><text x="40" y="543" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">settings.json</text><line x1="380" y1="580" x2="1080" y2="580" stroke="#e4e4dc" stroke-width="2"/><circle cx="730" cy="580" r="11" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="40" y="586" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Entry price</text><text x="40" y="608" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">$20/month for both</text><text x="40" y="652" text-anchor="start" font-family="Heebo" font-size="14" fill="#6d6d80">Sources: openai.com, February to May 2026; Claude Code docs</text></svg>