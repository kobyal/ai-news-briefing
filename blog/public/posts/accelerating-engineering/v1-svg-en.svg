<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">Three stages, with a human between each pair</text><text x="40" y="118" text-anchor="start" font-family="Heebo" font-size="22" fill="#6d6d80">LinkedIn's agent workflow for building Liger Kernel</text><rect x="60" y="200" width="260" height="190" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="80" y="245" text-anchor="start" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">Stage 1 · Understanding</text><text x="80" y="292" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">Reads code, URL or text</text><text x="80" y="326" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">Structured profile out</text><text x="80" y="360" text-anchor="start" font-family="Heebo" font-size="17" fill="#6d6d80">All decisions in one place</text><rect x="470" y="200" width="260" height="190" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="490" y="245" text-anchor="start" font-family="Heebo" font-weight="700" font-size="23" fill="#12121c">Stage 2</text><text x="490" y="292" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Kernel in Triton</text><text x="490" y="326" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">forward + backward</text><rect x="880" y="200" width="260" height="190" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="900" y="245" text-anchor="start" font-family="Heebo" font-weight="700" font-size="23" fill="#12121c">Stage 3</text><text x="900" y="292" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Correctness tests</text><text x="900" y="326" text-anchor="start" font-family="Heebo" font-size="19" fill="#12121c">Accuracy per precision</text><rect x="385" y="180" width="20" height="230" rx="6" fill="#5fb7ff"/><rect x="795" y="180" width="20" height="230" rx="6" fill="#5fb7ff"/><text x="395" y="445" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">Human review</text><text x="395" y="472" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">No approval, no next step</text><text x="805" y="445" text-anchor="middle" font-family="Heebo" font-weight="700" font-size="19" fill="#12121c">Human review</text><text x="805" y="472" text-anchor="middle" font-family="Heebo" font-size="16" fill="#6d6d80">No approval, no next step</text><line x1="322" y1="295" x2="371" y2="295" stroke="#12121c" stroke-width="2"/><polygon points="383,295 371,288 371,302" fill="#12121c"/><line x1="407" y1="295" x2="456" y2="295" stroke="#12121c" stroke-width="2"/><polygon points="468,295 456,288 456,302" fill="#12121c"/><line x1="732" y1="295" x2="781" y2="295" stroke="#12121c" stroke-width="2"/><polygon points="793,295 781,288 781,302" fill="#12121c"/><line x1="817" y1="295" x2="866" y2="295" stroke="#12121c" stroke-width="2"/><polygon points="878,295 866,288 866,302" fill="#12121c"/><line x1="40" y1="510" x2="1160" y2="510" stroke="#dcd7c8" stroke-width="1"/><text x="180" y="572" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="44" fill="#12121c">20%</text><text x="180" y="604" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">more throughput</text><text x="460" y="572" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="44" fill="#12121c">60%</text><text x="460" y="604" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">less memory</text><text x="740" y="572" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="44" fill="#12121c">~40</text><text x="740" y="604" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">model architectures</text><text x="1020" y="572" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700" font-size="44" fill="#12121c">7M+</text><text x="1020" y="604" text-anchor="middle" font-family="Heebo" font-size="18" fill="#6d6d80">downloads</text><text x="40" y="650" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Numbers for the kernels themselves, not the agents. Source: LinkedIn via ZenML LLMOps Database</text></svg>