<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="78" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">שלושה ניסיונות, ואז יוצאים</text><text x="1160" y="118" text-anchor="end" font-family="Heebo" font-size="22" fill="#6d6d80">כל ניסיון מתחיל בשיחה נקייה, והמודל לא מחליט מתי לעצור</text><line x1="60" y1="200" x2="800" y2="200" stroke="#5fb7ff" stroke-width="2"/><text x="60" y="185" text-anchor="start" font-family="Heebo" font-size="20" fill="#5fb7ff">exit 0</text><text x="800" y="185" text-anchor="end" font-family="Heebo" font-size="20" fill="#12121c">הטסט עבר: שומרים ויוצאים</text><line x1="170" y1="300" x2="170" y2="200" stroke="#5fb7ff" stroke-width="2"/><line x1="430" y1="300" x2="430" y2="200" stroke="#5fb7ff" stroke-width="2"/><line x1="690" y1="300" x2="690" y2="200" stroke="#5fb7ff" stroke-width="2"/><rect x="60" y="300" width="220" height="160" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><rect x="320" y="300" width="220" height="160" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><rect x="580" y="300" width="220" height="160" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="260" y="345" text-anchor="end" font-family="Heebo" font-weight="700" font-size="28" fill="#12121c">ניסיון ראשון</text><text x="260" y="385" text-anchor="end" font-family="Heebo" font-size="19" fill="#6d6d80">קובץ ולוג קצר</text><text x="80" y="430" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">exit 1</text><text x="520" y="345" text-anchor="end" font-family="Heebo" font-weight="700" font-size="28" fill="#12121c">ניסיון שני</text><text x="520" y="385" text-anchor="end" font-family="Heebo" font-size="19" fill="#6d6d80">שיחה חדשה לגמרי</text><text x="340" y="430" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">exit 1</text><text x="780" y="345" text-anchor="end" font-family="Heebo" font-weight="700" font-size="28" fill="#12121c">ניסיון שלישי</text><text x="780" y="385" text-anchor="end" font-family="Heebo" font-size="19" fill="#6d6d80">אחרון לפני החזרה</text><text x="600" y="430" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">git checkout</text><line x1="280" y1="380" x2="310" y2="380" stroke="#12121c" stroke-width="2"/><polygon points="320,380 308,373 308,387" fill="#12121c"/><line x1="540" y1="380" x2="570" y2="380" stroke="#12121c" stroke-width="2"/><polygon points="580,380 568,373 568,387" fill="#12121c"/><line x1="800" y1="380" x2="870" y2="380" stroke="#5fb7ff" stroke-width="2"/><polygon points="880,380 868,373 868,387" fill="#5fb7ff"/><rect x="880" y="300" width="280" height="160" rx="6" fill="#f6f3ea" stroke="#5fb7ff" stroke-width="2"/><text x="1140" y="345" text-anchor="end" font-family="Heebo" font-weight="700" font-size="28" fill="#5fb7ff">הסלמה</text><text x="1140" y="385" text-anchor="end" font-family="Heebo" font-size="19" fill="#6d6d80">מודל גדול, אותה בדיקה</text><text x="900" y="430" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Claude / Codex</text><line x1="60" y1="510" x2="800" y2="510" stroke="#dcd7c8" stroke-width="1"/><text x="800" y="545" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">מקומי, בלי עלות לטוקן</text><line x1="880" y1="510" x2="1160" y2="510" stroke="#dcd7c8" stroke-width="1"/><text x="1160" y="545" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">בתשלום לפי טוקן</text><text x="60" y="620" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">MAX_TRIES = 3  ·  tail 60 lines  ·  timeout 120s  ·  num_ctx 8192</text></svg>