<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="60" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Five eval layers, and which would have caught August</text><text x="60" y="94" font-family="Heebo" font-size="18" fill="#6d6d80">Cheapest to most expensive, top to bottom. Input: a morning where two agents returned an empty object</text><rect x="60" y="125" width="1080" height="80" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="90" y="159" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Asserts in code</text><text x="90" y="187" font-family="Heebo" font-size="17" fill="#6d6d80">schema · required fields · item count · runs in milliseconds</text><rect x="840" y="145" width="280" height="40" rx="6" fill="#ffb454"/><text x="980" y="172" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c" text-anchor="middle">Caught on the first morning</text><rect x="60" y="221" width="1080" height="80" rx="6" fill="#ffffff" stroke="#e4e4dc" stroke-width="2"/><text x="90" y="255" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Golden set</text><text x="90" y="283" font-family="Heebo" font-size="17" fill="#6d6d80">real days from the archive, bad days included</text><rect x="840" y="241" width="280" height="40" rx="6" fill="none" stroke="#ffb454" stroke-width="2"/><text x="980" y="268" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">Aug 5–7 are in it now</text><rect x="60" y="317" width="1080" height="80" rx="6" fill="#ffffff" stroke="#e4e4dc" stroke-width="2"/><text x="90" y="351" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">LLM-as-judge</text><text x="90" y="379" font-family="Heebo" font-size="17" fill="#6d6d80">one scorer, not the truth · calibrate against human labels</text><rect x="840" y="337" width="280" height="40" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="5 4"/><text x="980" y="364" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">Misses: nothing to score</text><rect x="60" y="413" width="1080" height="80" rx="6" fill="#ffffff" stroke="#e4e4dc" stroke-width="2"/><text x="90" y="447" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Pairwise</text><text x="90" y="475" font-family="Heebo" font-size="17" fill="#6d6d80">old prompt vs. new · twice, in reversed order</text><rect x="840" y="433" width="280" height="40" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="5 4"/><text x="980" y="460" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">Misses</text><rect x="60" y="509" width="1080" height="80" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="90" y="543" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Regression on real traffic</text><text x="90" y="571" font-family="Heebo" font-size="17" fill="#6d6d80">shadow on yesterday's inputs · diff items, empty fields, length</text><rect x="840" y="529" width="280" height="40" rx="6" fill="#ffb454"/><text x="980" y="556" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c" text-anchor="middle">Caught: the count diff</text><text x="60" y="635" font-family="Heebo" font-size="17" fill="#6d6d80">Both layers that catch it never call a model. The judge, the expensive layer, misses.</text></svg>