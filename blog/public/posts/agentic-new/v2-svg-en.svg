<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c" text-anchor="start">Agentic is a dial, not a switch</text><text x="40" y="118" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="start">The only question: who picks the next step, the code or the model</text><path d="M1050 228 L1050 212 L370 212 L370 228" fill="none" stroke="#5fb7ff" stroke-width="2"/><text x="710" y="196" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">Andrew Ng, 2024: from here on, it's already a bit agentic</text><line x1="140" y1="340" x2="1050" y2="340" stroke="#12121c" stroke-width="2"/><line x1="370" y1="340" x2="1050" y2="340" stroke="#5fb7ff" stroke-width="8"/><line x1="708" y1="250" x2="708" y2="470" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 6"/><text x="696" y="268" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">workflow</text><text x="720" y="268" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="start">agent</text><text x="708" y="494" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">Anthropic's line, December 2024</text><circle cx="140" cy="340" r="11" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="370" cy="340" r="11" fill="#5fb7ff" stroke="#12121c" stroke-width="2"/><circle cx="595" cy="340" r="11" fill="#5fb7ff" stroke="#12121c" stroke-width="2"/><circle cx="820" cy="340" r="11" fill="#5fb7ff" stroke="#12121c" stroke-width="2"/><circle cx="1050" cy="340" r="11" fill="#5fb7ff" stroke="#12121c" stroke-width="2"/><text x="140" y="305" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="middle">One call</text><text x="370" y="305" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="middle">Fixed chain</text><text x="595" y="305" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="middle">Router</text><text x="820" y="305" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="middle">Loop with tools</text><text x="1050" y="305" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="middle">Open loop</text><text x="140" y="385" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">Code decides everything</text><text x="370" y="385" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">Code sets the order</text><text x="595" y="385" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">Model picks a branch</text><text x="820" y="385" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="middle">Model picks a tool</text><text x="1050" y="385" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">Model decides when to stop</text><text x="140" y="420" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Wrong answer</text><text x="370" y="420" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">A step breaks silently</text><text x="595" y="420" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Wrong branch</text><text x="820" y="420" font-family="Heebo" font-size="17" fill="#12121c" text-anchor="middle">Burns tokens</text><text x="1050" y="420" font-family="Heebo" font-size="16" fill="#12121c" text-anchor="middle">Deletes the DB (Replit, 2025)</text><line x1="140" y1="570" x2="1040" y2="570" stroke="#6d6d80" stroke-width="2"/><polygon points="1055,570 1037,561 1037,579" fill="#6d6d80"/><text x="40" y="615" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="start">Each step right: more autonomy, more cost, more checks</text></svg>