<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="70" text-anchor="end" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">הדליפה לא במודל. היא ב-container</text><text x="1160" y="108" text-anchor="end" font-family="Heebo" font-size="22" fill="#6d6d80">אותו agent, אותה משימה, שתי סביבות</text><text x="1160" y="172" text-anchor="end" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c">לפני: repo עם היסטוריה מלאה</text><rect x="100" y="195" width="1000" height="120" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="8 6"/><text x="120" y="222" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">sandbox</text><line x1="140" y1="255" x2="1060" y2="255" stroke="#12121c" stroke-width="2"/><circle cx="180" cy="255" r="9" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="340" cy="255" r="9" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="500" cy="255" r="13" fill="#12121c"/><circle cx="660" cy="255" r="9" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="820" cy="255" r="15" fill="#8b83ff" stroke="#12121c" stroke-width="2"/><circle cx="980" cy="255" r="9" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="500" y="297" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">base commit</text><text x="820" y="297" text-anchor="middle" font-family="Heebo" font-size="18" font-weight="700" fill="#8b83ff">gold fix</text><path d="M500 240 Q655 160 808 238" fill="none" stroke="#8b83ff" stroke-width="2"/><polygon points="808,238 792,238 799,225" fill="#8b83ff"/><text x="655" y="180" text-anchor="middle" font-family="Heebo" font-size="20" fill="#8b83ff">git log / git show</text><text x="1160" y="350" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">12%+ מה-rollouts של Opus שנבדקו (audit, מאי 2026)</text><line x1="40" y1="385" x2="1160" y2="385" stroke="#dcd7c8" stroke-width="1"/><text x="1160" y="440" text-anchor="end" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c">אחרי: clone של commit אחד, בלי remote</text><line x1="140" y1="525" x2="1060" y2="525" stroke="#dcd7c8" stroke-width="1" stroke-dasharray="4 6"/><circle cx="180" cy="525" r="9" fill="#f6f3ea" stroke="#dcd7c8" stroke-width="1"/><circle cx="340" cy="525" r="9" fill="#f6f3ea" stroke="#dcd7c8" stroke-width="1"/><circle cx="660" cy="525" r="9" fill="#f6f3ea" stroke="#dcd7c8" stroke-width="1"/><circle cx="820" cy="525" r="9" fill="#f6f3ea" stroke="#dcd7c8" stroke-width="1"/><circle cx="980" cy="525" r="9" fill="#f6f3ea" stroke="#dcd7c8" stroke-width="1"/><rect x="440" y="470" width="120" height="110" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><circle cx="500" cy="525" r="13" fill="#12121c"/><line x1="516" y1="525" x2="550" y2="525" stroke="#8b83ff" stroke-width="2"/><line x1="580" y1="512" x2="600" y2="532" stroke="#8b83ff" stroke-width="2"/><line x1="600" y1="512" x2="580" y2="532" stroke="#8b83ff" stroke-width="2"/><text x="620" y="500" text-anchor="start" font-family="Heebo" font-size="18" fill="#8b83ff">אין לאן ללכת</text><text x="500" y="610" text-anchor="middle" font-family="Heebo" font-size="18" fill="#12121c">git rev-list --all = 1</text><text x="1160" y="648" text-anchor="end" font-family="Heebo" font-size="20" fill="#6d6d80">ה-patch חייב לבוא מהקוד, לא מההיסטוריה</text></svg>