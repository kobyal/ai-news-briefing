<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="40" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">Same model, different request</text><text x="40" y="98" font-family="Heebo" font-size="18" fill="#6d6d80">Michael Heap asks an agent for a new trello-cli command, March 2026</text><line x1="540" y1="130" x2="640" y2="650" stroke="#e4e4dc" stroke-width="2"/><text x="40" y="152" font-family="Heebo" font-size="18" fill="#6d6d80">Before · one sentence</text><rect x="40" y="168" width="440" height="64" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="260" y="207" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">“Add support for showing card details”</text><text x="40" y="285" font-family="Heebo" font-size="16" fill="#6d6d80">What came out</text><rect x="40" y="300" width="240" height="36" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="60" y="324" font-family="Heebo" font-size="18" fill="#12121c">title ✓</text><rect x="40" y="346" width="240" height="36" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="60" y="370" font-family="Heebo" font-size="18" fill="#12121c">description ✓</text><rect x="40" y="392" width="240" height="36" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="60" y="416" font-family="Heebo" font-size="18" fill="#12121c">labels ✓</text><rect x="40" y="438" width="240" height="36" rx="6" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 5"/><text x="60" y="462" font-family="Heebo" font-size="18" fill="#6d6d80">due date · missing</text><rect x="40" y="484" width="240" height="36" rx="6" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="6 5"/><text x="60" y="508" font-family="Heebo" font-size="18" fill="#6d6d80">checklists · missing</text><text x="40" y="580" font-family="Heebo" font-size="18" fill="#6d6d80">Whatever wasn't written, the model filled in</text><text x="700" y="152" font-family="Heebo" font-size="18" fill="#6d6d80">After · five sentences</text><rect x="700" y="168" width="460" height="172" rx="6" fill="#ffffff" stroke="#ffb454" stroke-width="2"/><text x="720" y="204" font-family="Heebo" font-size="18" fill="#12121c">card:show --board --list</text><text x="720" y="240" font-family="Heebo" font-size="18" fill="#12121c">a list of fields to display</text><text x="720" y="276" font-family="Heebo" font-size="18" fill="#12121c">empty field: skip the header</text><text x="720" y="312" font-family="Heebo" font-size="18" fill="#12121c">over 10 checklist items: “+ X more”</text><text x="700" y="375" font-family="Heebo" font-size="16" fill="#6d6d80">What came out</text><rect x="700" y="390" width="220" height="36" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="718" y="414" font-family="Heebo" font-size="18" fill="#12121c">title ✓</text><rect x="700" y="434" width="220" height="36" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="718" y="458" font-family="Heebo" font-size="18" fill="#12121c">description ✓</text><rect x="700" y="478" width="220" height="36" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="718" y="502" font-family="Heebo" font-size="18" fill="#12121c">labels ✓</text><rect x="700" y="522" width="220" height="36" rx="6" fill="#ffb454" stroke="#12121c" stroke-width="2"/><text x="718" y="546" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">due date ✓</text><rect x="700" y="566" width="220" height="36" rx="6" fill="#ffb454" stroke="#12121c" stroke-width="2"/><text x="718" y="590" font-family="Heebo" font-weight="700" font-size="18" fill="#12121c">checklists ✓</text><text x="950" y="470" font-family="Heebo" font-size="20" fill="#6d6d80">an hour of manual work</text><text x="950" y="522" font-family="Frank Ruhl Libre" font-weight="700" font-size="36" fill="#12121c">a few minutes</text></svg>