<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">What enters the context on every call</text><text x="40" y="106" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Same rules, two ways to ship them</text><text x="40" y="160" text-anchor="start" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">Everything in the system prompt</text><rect x="40" y="175" width="750" height="50" rx="6" fill="#12121c"/><text x="40" y="255" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">5,000 tokens on every call, even when the task is unrelated</text><text x="40" y="310" text-anchor="start" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">20 skills, a regular question</text><rect x="40" y="325" width="300" height="50" rx="6" fill="#8b83ff"/><line x1="40" y1="350" x2="340" y2="350" stroke="#f6f3ea" stroke-width="50" stroke-dasharray="1 14"/><text x="40" y="405" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">~100 tokens per skill × 20 = ~2,000. Only name and description</text><text x="40" y="460" text-anchor="start" font-family="Heebo" font-size="22" font-weight="700" fill="#12121c">20 skills, a migration task</text><rect x="40" y="475" width="300" height="50" rx="6" fill="#8b83ff"/><line x1="40" y1="500" x2="340" y2="500" stroke="#f6f3ea" stroke-width="50" stroke-dasharray="1 14"/><rect x="344" y="475" width="90" height="50" rx="6" fill="none" stroke="#8b83ff" stroke-width="2"/><text x="389" y="506" text-anchor="middle" font-family="Heebo" font-size="16" fill="#12121c">body</text><rect x="438" y="475" width="8" height="50" rx="2" fill="#6d6d80"/><line x1="442" y1="470" x2="495" y2="440" stroke="#6d6d80" stroke-width="1"/><text x="502" y="444" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">script output only</text><text x="40" y="555" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">+ one body (~600 tokens) only when the task matches. The script's code never enters</text><line x1="40" y1="600" x2="790" y2="600" stroke="#dcd7c8" stroke-width="1"/><line x1="40" y1="594" x2="40" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="190" y1="594" x2="190" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="340" y1="594" x2="340" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="490" y1="594" x2="490" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="640" y1="594" x2="640" y2="606" stroke="#dcd7c8" stroke-width="1"/><line x1="790" y1="594" x2="790" y2="606" stroke="#dcd7c8" stroke-width="1"/><text x="45" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">0</text><text x="190" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">1,000</text><text x="340" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">2,000</text><text x="490" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">3,000</text><text x="640" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">4,000</text><text x="790" y="628" text-anchor="middle" font-family="Heebo" font-size="14" fill="#6d6d80">5,000</text><text x="820" y="605" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">tokens</text><text x="1160" y="660" text-anchor="end" font-family="Heebo" font-size="14" fill="#6d6d80">Sources: Anthropic's Agent Skills docs · dev.to (a prompt that grew from 200 to 5,000)</text></svg>