<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="88" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c" text-anchor="start">Who decides whether it runs</text><text x="40" y="128" font-family="Heebo" font-size="22" fill="#6d6d80" text-anchor="start">Four mechanisms on one axis. Only one crosses the line.</text><line x1="750" y1="190" x2="750" y2="560" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 6"/><text x="764" y="212" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Determinism line</text><line x1="100" y1="380" x2="1070" y2="380" stroke="#12121c" stroke-width="2"/><polygon points="1088,380 1068,371 1068,389" fill="#12121c"/><circle cx="200" cy="380" r="14" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="380" cy="380" r="14" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="580" cy="380" r="14" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="920" cy="380" r="20" fill="#8b83ff" stroke="#12121c" stroke-width="2"/><text x="200" y="340" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="middle">skill</text><text x="380" y="340" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="middle">MCP</text><text x="580" y="340" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="middle">CLAUDE.md</text><text x="920" y="340" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="middle">hook</text><text x="200" y="432" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">Loaded when the model</text><text x="200" y="458" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">thinks it's relevant</text><text x="380" y="432" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">Runs if the model</text><text x="380" y="458" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">chooses to call the tool</text><text x="580" y="432" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">Always in context,</text><text x="580" y="458" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">usually followed</text><text x="920" y="432" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">Runs on every tool call</text><text x="920" y="458" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">exit 2 blocks</text><line x1="110" y1="500" x2="670" y2="500" stroke="#e4e4dc" stroke-width="2"/><line x1="670" y1="488" x2="670" y2="500" stroke="#e4e4dc" stroke-width="2"/><line x1="110" y1="488" x2="110" y2="500" stroke="#e4e4dc" stroke-width="2"/><text x="390" y="534" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="middle">Probabilistic: depends on the model's choice</text><line x1="810" y1="500" x2="1030" y2="500" stroke="#8b83ff" stroke-width="2"/><line x1="1030" y1="488" x2="1030" y2="500" stroke="#8b83ff" stroke-width="2"/><line x1="810" y1="488" x2="810" y2="500" stroke="#8b83ff" stroke-width="2"/><text x="920" y="534" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">Deterministic: depends on your code</text><text x="100" y="620" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">Model chooses</text><text x="1088" y="620" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">Always runs</text></svg>