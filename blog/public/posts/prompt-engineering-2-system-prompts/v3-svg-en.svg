<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="72" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c" text-anchor="start">One timestamp line burns $216 a day</text><text x="40" y="110" font-family="Heebo" font-size="20" fill="#6d6d80" text-anchor="start">8,000 tokens in system · 10,000 calls a day · Sonnet at $3 per million</text><line x1="40" y1="140" x2="1160" y2="140" stroke="#e4e4dc" stroke-width="1"/><text x="240" y="200" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c" text-anchor="start">Timestamp in the first line</text><rect x="240" y="220" width="80" height="70" rx="6" fill="#ffb454" stroke="#12121c" stroke-width="2"/><text x="280" y="261" font-family="Heebo" font-size="15" fill="#12121c" text-anchor="middle">14:32:07</text><rect x="320" y="220" width="430" height="70" rx="6" fill="#e4e4dc" stroke="#12121c" stroke-width="2"/><text x="535" y="262" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">rules · examples · contract</text><rect x="750" y="220" width="110" height="70" rx="6" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><text x="805" y="262" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">user</text><text x="240" y="322" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="start">The prefix changes on every call, so it's always a cache miss</text><text x="900" y="262" font-family="Frank Ruhl Libre" font-weight="700" font-size="48" fill="#12121c" text-anchor="start">$240</text><text x="900" y="292" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="start">per day</text><line x1="40" y1="355" x2="1160" y2="355" stroke="#e4e4dc" stroke-width="1"/><text x="240" y="390" font-family="Heebo" font-size="24" font-weight="700" fill="#12121c" text-anchor="start">Timestamp in the user message</text><rect x="240" y="420" width="430"