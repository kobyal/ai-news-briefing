<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="1160" y="70" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="end">מחשב אחד לכל הבוטים, או מחשב לכל בוט</text><line x1="600" y1="110" x2="600" y2="630" stroke="#e4e4dc" stroke-width="2"/><text x="1160" y="140" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="end">Grok Bot</text><text x="1160" y="172" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">כל הבוטים בחשבון חולקים מחשב ענן אחד</text><line x1="700" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="780" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="860" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="940" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="1020" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="1100" y1="264" x2="900" y2="330" stroke="#6d6d80" stroke-width="1"/><circle cx="700" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="780" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="860" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="940" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="1020" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="1100" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><rect x="660" y="330" width="480" height="160" rx="6" fill="#3ecfb2" fill-opacity="0.18" stroke="#3ecfb2" stroke-width="2"/><text x="900" y="392" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c" text-anchor="middle">cloud computer</text><text x="900" y="432" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">cookies · saved logins · files · terminal</text><text x="1160" y="550" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">סשן Gmail אחד, שישה בוטים שמחזיקים אותו</text><text x="1160" y="585" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">מחיקת בוט לא מוחקת סשנים או קבצים (FAQ)</text><text x="560" y="140" font-family="Heebo" font-weight="700" font-size="26" fill="#12121c" text-anchor="end">Errand · open-source</text><text x="560" y="172" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">runtime מבודד לכל teammate: shell, browser, fs</text><line x1="130" y1="264" x2="130" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="300" y1="264" x2="300" y2="330" stroke="#6d6d80" stroke-width="1"/><line x1="470" y1="264" x2="470" y2="330" stroke="#6d6d80" stroke-width="1"/><circle cx="130" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="300" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><circle cx="470" cy="240" r="24" fill="#f6f3ea" stroke="#12121c" stroke-width="2"/><rect x="60" y="330" width="140" height="160" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="230" y="330" width="140" height="160" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><rect x="400" y="330" width="140" height="160" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="130" y="418" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">runtime</text><text x="300" y="418" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">runtime</text><text x="470" y="418" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="middle">runtime</text><text x="560" y="550" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">4,000 שורות TypeScript, נבנה בשבוע</text><text x="560" y="585" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">הגבול הוא הבוט, ואת התשתית מחזיקים אתם</text></svg>