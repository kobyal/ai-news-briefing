<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#12121c"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3ecfb2"/></marker></defs><rect width="1200" height="675" fill="#fbfbf9"/><text x="40" y="80" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">Where the design ends up</text><text x="40" y="118" text-anchor="start" font-family="Heebo" font-size="22" fill="#6d6d80">Two paths from idea to a blog rebuilt every morning</text><text x="40" y="190" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Via Claude Design</text><rect x="50" y="205" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="70" y="248" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Idea</text><rect x="280" y="205" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="375" y="248" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">canvas</text><rect x="510" y="205" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="605" y="247" text-anchor="middle" font-family="Heebo" font-size="20" fill="#12121c">export / handoff</text><rect x="740" y="205" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="835" y="248" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">Claude Code</text><rect x="970" y="205" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="1065" y="248" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">Astro + CSS</text><line x1="242" y1="240" x2="278" y2="240" stroke="#12121c" stroke-width="2" marker-end="url(#a)"/><line x1="472" y1="240" x2="508" y2="240" stroke="#12121c" stroke-width="2" marker-end="url(#a)"/><line x1="702" y1="240" x2="738" y2="240" stroke="#12121c" stroke-width="2" marker-end="url(#a)"/><line x1="932" y1="240" x2="968" y2="240" stroke="#12121c" stroke-width="2" marker-end="url(#a)"/><path d="M1065 277 C1065 345, 375 345, 375 279" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="6 6" marker-end="url(#a)"/><text x="500" y="374" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Every CSS fix has to go back to the canvas, or it goes stale</text><text x="40" y="410" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Straight to code</text><rect x="50" y="425" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#3ecfb2" stroke-width="2"/><text x="70" y="468" text-anchor="start" font-family="Heebo" font-size="22" fill="#12121c">Idea</text><rect x="740" y="425" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#3ecfb2" stroke-width="2"/><text x="835" y="468" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">Claude Code</text><rect x="970" y="425" width="190" height="70" rx="6" fill="#fbfbf9" stroke="#3ecfb2" stroke-width="2"/><text x="1065" y="468" text-anchor="middle" font-family="Heebo" font-size="22" fill="#12121c">Astro + CSS</text><line x1="242" y1="460" x2="738" y2="460" stroke="#3ecfb2" stroke-width="2" marker-end="url(#b)"/><text x="320" y="446" text-anchor="start" font-family="Heebo" font-size="18" fill="#12121c">Same brief, straight to the repo</text><line x1="932" y1="460" x2="968" y2="460" stroke="#3ecfb2" stroke-width="2" marker-end="url(#b)"/><line x1="40" y1="545" x2="1160" y2="545" stroke="#e4e4dc" stroke-width="1"/><rect x="40" y="580" width="16" height="16" rx="3" fill="none" stroke="#12121c" stroke-width="2"/><text x="70" y="595" text-anchor="start" font-family="Heebo" font-size="24" fill="#12121c">Via the canvas: 2 handoffs, 2 sources of truth</text><rect x="40" y="618" width="16" height="16" rx="3" fill="#3ecfb2"/><text x="70" y="633" text-anchor="start" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">Straight to code: 0 handoffs, 1 source of truth</text><text x="1160" y="633" text-anchor="end" font-family="Heebo" font-size="18" fill="#6d6d80">Ours: Astro, one CSS file, an agent making visuals every morning</text></svg>