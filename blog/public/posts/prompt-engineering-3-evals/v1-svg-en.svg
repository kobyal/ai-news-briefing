<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="60" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">What the parser got, and what it returned</text><text x="60" y="94" font-family="Heebo" font-size="18" fill="#6d6d80">claude -p output in the rss and editorial agents, August 5–7, 2026</text><text x="60" y="112" font-family="Heebo" font-size="15" fill="#6d6d80">stdout</text><rect x="60" y="120" width="700" height="300" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><rect x="76" y="138" width="668" height="78" rx="6" fill="#ffb454" fill-opacity="0.28"/><text x="92" y="170" font-family="Heebo" font-size="19" fill="#12121c">Per the audit rules in this session, this task is safe</text><text x="92" y="200" font-family="Heebo" font-size="19" fill="#12121c">and they don't apply to it. Here is the JSON:</text><rect x="84" y="230" width="26" height="30" rx="6" fill="none" stroke="#ffb454" stroke-width="2"/><text x="92" y="252" font-family="Heebo" font-size="19" fill="#12121c">{</text><text x="116" y="282" font-family="Heebo" font-size="19" fill="#12121c">"items": [</text><text x="140" y="312" font-family="Heebo" font-size="19" fill="#12121c">{ "headline": "…", "url": "…" },</text><text x="140" y="342" font-family="Heebo" font-size="19" fill="#12121c">…</text><text x="116" y="372" font-family="Heebo" font-size="19" fill="#12121c">]</text><text x="92" y="400" font-family="Heebo" font-size="19" fill="#12121c">}</text><line x1="744" y1="177" x2="800" y2="177" stroke="#12121c" stroke-width="1"/><text x="820" y="172" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">A paragraph before the opening brace</text><text x="820" y="200" font-family="Heebo" font-size="17" fill="#6d6d80">a reply to session rules, not to our prompt</text><line x1="112" y1="246" x2="800" y2="246" stroke="#12121c" stroke-width="1" stroke-dasharray="4 4"/><text x="820" y="252" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">Perfectly valid JSON</text><text x="820" y="280" font-family="Heebo" font-size="17" fill="#6d6d80">just not at the first character of the string</text><rect x="60" y="470" width="340" height="110" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="80" y="512" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">parse_json</text><text x="80" y="545" font-family="Heebo" font-size="17" fill="#6d6d80">doesn't start with a brace, repair fails</text><line x1="402" y1="525" x2="448" y2="525" stroke="#12121c" stroke-width="2"/><polygon points="458,525 446,518 446,532" fill="#12121c"/><rect x="460" y="470" width="220" height="110" rx="6" fill="#ffb454" stroke="#12121c" stroke-width="2"/><text x="570" y="532" font-family="Heebo" font-weight="700" font-size="44" fill="#12121c" text-anchor="middle">{}</text><text x="570" y="564" font-family="Heebo" font-size="16" fill="#12121c" text-anchor="middle">also valid JSON</text><line x1="682" y1="525" x2="728" y2="525" stroke="#12121c" stroke-width="2"/><polygon points="738,525 726,518 726,532" fill="#12121c"/><rect x="740" y="470" width="400" height="110" rx="6" fill="#ffffff" stroke="#12121c" stroke-width="2"/><text x="760" y="512" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">exit 0 · file written</text><text x="760" y="545" font-family="Heebo" font-size="17" fill="#6d6d80">the merger carries on with what it has</text><text x="60" y="632" font-family="Heebo" font-size="17" fill="#6d6d80">Every check was green, because an empty object looks exactly like success</text></svg>