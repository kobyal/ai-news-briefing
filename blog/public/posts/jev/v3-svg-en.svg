<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="60" y="64" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">0.9 should mean 9 out of 10</text><line x1="140" y1="186" x2="760" y2="186" stroke="#e4e4dc" stroke-width="1"/><line x1="140" y1="324" x2="760" y2="324" stroke="#e4e4dc" stroke-width="1"/><rect x="729" y="140" width="31" height="460" fill="#8b83ff" fill-opacity="0.15"/><line x1="729" y1="140" x2="729" y2="600" stroke="#8b83ff" stroke-width="2" stroke-dasharray="6 5"/><text x="729" y="130" font-family="Heebo" font-size="18" fill="#8b83ff" text-anchor="middle">0.95</text><line x1="140" y1="140" x2="140" y2="600" stroke="#12121c" stroke-width="2"/><line x1="140" y1="600" x2="760" y2="600" stroke="#12121c" stroke-width="2"/><line x1="140" y1="600" x2="760" y2="140" stroke="#8b83ff" stroke-width="3"/><polyline points="140,600 326,453 450,393 574,361 698,324 760,306" fill="none" stroke="#6d6d80" stroke-width="2" stroke-dasharray="8 6"/><line x1="698" y1="186" x2="698" y2="324" stroke="#12121c" stroke-width="1"/><circle cx="698" cy="186" r="7" fill="#8b83ff"/><circle cx="698" cy="324" r="7" fill="#fbfbf9" stroke="#6d6d80" stroke-width="2"/><text x="680" y="172" font-family="Heebo" font-size="18" fill="#8b83ff" text-anchor="end">Calibrated: what RLCD targets</text><text x="690" y="432" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">Uncalibrated (illustration): says 0.9, right 60%</text><text x="140" y="630" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">0</text><text x="450" y="630" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">0.5</text><text x="698" y="630" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle">0.9</text><text x="125" y="192" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">0.9</text><text x="125" y="330" font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="end">0.6</text><text x="450" y="660" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="middle">Probability the model reports</text><text x="150" y="126" font-family="Heebo" font-size="18" fill="#12121c">How often it was actually right</text><line x1="800" y1="140" x2="800" y2="600" stroke="#e4e4dc" stroke-width="1"/><text x="830" y="172" font-family="Heebo" font-weight="700" font-size="20" fill="#8b83ff">Threshold: 0.95</text><text x="830" y="206" font-family="Heebo" font-size="19" fill="#12121c">Above: your code acts alone</text><text x="830" y="240" font-family="Heebo" font-size="19" fill="#12121c">Below: it goes to review</text><text x="830" y="302" font-family="Heebo" font-weight="700" font-size="20" fill="#12121c">The test for this week</text><text x="830" y="336" font-family="Heebo" font-size="19" fill="#12121c">100 labeled examples, real data</text><text x="830" y="370" font-family="Heebo" font-size="19" fill="#12121c">Check only answers near 0.9</text><text x="830" y="420" font-family="Heebo" font-size="19" fill="#8b83ff">~90% right → you don't need Jev</text><text x="830" y="454" font-family="Heebo" font-size="19" fill="#6d6d80">~60% right → that's what TypeSafe sells</text><text x="830" y="520" font-family="Heebo" font-size="17" fill="#6d6d80">Qwen3-0.6B in 25 lines: Phishing 0.885</text><text x="830" y="550" font-family="Heebo" font-size="17" fill="#6d6d80">Without calibration, is that really 88%?</text></svg>