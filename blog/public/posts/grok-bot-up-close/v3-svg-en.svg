<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="40" y="70" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="38" fill="#12121c">Grok Bot vs Errand: who holds the computer</text><text x="40" y="106" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Same product on paper, opposite call on the first row</text><text x="360" y="165" text-anchor="start" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">Grok Bot</text><text x="765" y="165" text-anchor="start" font-family="Heebo" font-weight="700" font-size="24" fill="#12121c">Errand</text><line x1="40" y1="185" x2="1160" y2="185" stroke="#12121c" stroke-width="2"/><line x1="340" y1="140" x2="340" y2="612" stroke="#e4e4dc" stroke-width="1"/><line x1="745" y1="140" x2="745" y2="612" stroke="#e4e4dc" stroke-width="1"/><rect x="40" y="192" width="1120" height="76" rx="6" fill="#3ecfb2" fill-opacity="0.14" stroke="#3ecfb2" stroke-width="2"/><text x="60" y="238" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Cloud computer</text><text x="360" y="238" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">One per user, shared by all bots</text><text x="765" y="238" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Isolated machine per teammate</text><line x1="40" y1="272" x2="1160" y2="272" stroke="#e4e4dc" stroke-width="1"/><text x="60" y="323" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Model choice</text><text x="360" y="323" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Grok only, no settings</text><text x="765" y="323" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Has a default, and you can swap it</text><line x1="40" y1="357" x2="1160" y2="357" stroke="#e4e4dc" stroke-width="1"/><text x="60" y="408" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Time to first bot</text><text x="360" y="408" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Minutes, sign in via Cursor</text><text x="765" y="408" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">A week of dev, about 4,000 lines</text><line x1="40" y1="442" x2="1160" y2="442" stroke="#e4e4dc" stroke-width="1"/><text x="60" y="493" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Price</text><text x="360" y="493" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">$20 to $300 a month</text><text x="765" y="493" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Free code, you run the infra</text><line x1="40" y1="527" x2="1160" y2="527" stroke="#e4e4dc" stroke-width="1"/><text x="60" y="578" text-anchor="start" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c">Platforms</text><text x="360" y="578" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Desktop, iPhone and Android</text><text x="765" y="578" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">Desktop app only</text><line x1="40" y1="612" x2="1160" y2="612" stroke="#12121c" stroke-width="2"/><text x="40" y="650" text-anchor="start" font-family="Heebo" font-size="15" fill="#6d6d80">Sources: launch post (August) and Runta blog (September)</text></svg>