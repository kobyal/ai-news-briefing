<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect x="0" y="0" width="1200" height="675" fill="#f6f3ea"/><text x="40" y="78" text-anchor="start" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#12121c">The agents run in parallel. You don't.</text><text x="40" y="116" text-anchor="start" font-family="Heebo" font-size="20" fill="#6d6d80">Each in its own devbox, all landing on the same review</text><rect x="60" y="170" width="300" height="90" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="80" y="208" text-anchor="start" font-family="Heebo" font-size="24" fill="#12121c">agent 1</text><text x="80" y="240" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">agent/fix-checkout</text><rect x="60" y="300" width="300" height="90" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="80" y="338" text-anchor="start" font-family="Heebo" font-size="24" fill="#12121c">agent 2</text><text x="80" y="370" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">agent/flaky-test</text><rect x="60" y="430" width="300" height="90" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="80" y="468" text-anchor="start" font-family="Heebo" font-size="24" fill="#12121c">agent 3</text><text x="80" y="500" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">agent/bump-deps</text><text x="60" y="560" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">A warm devbox boots in about 5 seconds</text><line x1="360" y1="215" x2="486" y2="330" stroke="#12121c" stroke-width="2"/><line x1="360" y1="345" x2="486" y2="340" stroke="#12121c" stroke-width="2"/><line x1="360" y1="475" x2="486" y2="350" stroke="#12121c" stroke-width="2"/><polygon points="500,340 486,332 486,348" fill="#12121c"/><rect x="510" y="310" width="70" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="545" y="348" text-anchor="middle" font-family="Heebo" font-size="20" fill="#12121c">PR</text><rect x="600" y="310" width="70" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="635" y="348" text-anchor="middle" font-family="Heebo" font-size="20" fill="#12121c">PR</text><rect x="690" y="310" width="70" height="60" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="725" y="348" text-anchor="middle" font-family="Heebo" font-size="20" fill="#12121c">PR</text><text x="510" y="405" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Waiting for review</text><line x1="770" y1="340" x2="842" y2="340" stroke="#12121c" stroke-width="2"/><polygon points="856,340 842,332 842,348" fill="#12121c"/><rect x="860" y="270" width="280" height="140" rx="6" fill="#8b83ff" stroke="#12121c" stroke-width="2"/><text x="880" y="330" text-anchor="start" font-family="Heebo" font-weight="700" font-size="36" fill="#12121c">You</text><text x="880" y="372" text-anchor="start" font-family="Heebo" font-size="20" fill="#12121c">One focus, one queue</text><line x1="860" y1="450" x2="1140" y2="450" stroke="#dcd7c8" stroke-width="1" stroke-dasharray="6 6"/><text x="860" y="482" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">Still open: which branch,</text><text x="860" y="508" text-anchor="start" font-family="Heebo" font-size="18" fill="#6d6d80">which decision, which handoff</text><line x1="40" y1="600" x2="1160" y2="600" stroke="#dcd7c8" stroke-width="1"/><text x="40" y="634" text-anchor="start" font-family="Heebo" font-size="16" fill="#6d6d80">Source: HackerNoon, Coding agents explained, 2026 · Aether</text></svg>