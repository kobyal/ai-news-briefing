<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="600" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="middle">Every mistake, once</text><text x="600" y="94" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="middle">The harness tightens with every screwup</text><g stroke="#12121c" stroke-width="2" fill="#5fb7ff"><rect x="120" y="470" width="300" height="110" rx="6"/><rect x="420" y="380" width="300" height="200" rx="6"/><rect x="720" y="290" width="300" height="290" rx="6"/></g><rect x="1030" y="200" width="120" height="380" rx="6" fill="none" stroke="#6d6d80" stroke-width="1" stroke-dasharray="8 6"/><line x1="90" y1="580" x2="1160" y2="580" stroke="#12121c" stroke-width="2"/><g font-family="Heebo" fill="#12121c" text-anchor="middle"><text x="270" y="512" font-size="22" font-weight="700">lint rule</text><text x="270" y="540" font-size="15">enforced on every import</text><text x="570" y="422" font-size="22" font-weight="700">hook</text><text x="570" y="450" font-size="15">no ‘done’ without green CI</text><text x="870" y="332" font-size="22" font-weight="700">AGENTS.md</text><text x="870" y="360" font-size="15">read at every session start</text></g><g font-family="Heebo" font-size="16" fill="#6d6d80" text-anchor="middle"><text x="270" y="410">another line in the prompt</text><text x="270" y="454">Mistake: forbidden-dir import</text><text x="570" y="364">Mistake: ‘done’ with red tests</text><text x="870" y="274">Mistake: forgot a convention</text><text x="1090" y="432" font-size="15">the next one</text><text x="600" y="625">A decent model with a great harness beats a great model with a bad harness</text></g><line x1="174" y1="404" x2="366" y2="404" stroke="#6d6d80" stroke-width="2"/><text x="1090" y="392" font-family="Frank Ruhl Libre" font-weight="700" font-size="40" fill="#6d6d80" text-anchor="middle">?</text></svg>