<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="1140" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c" text-anchor="end">מה שיציב למעלה, מה שמשתנה למטה</text><line x1="60" y1="88" x2="1140" y2="88" stroke="#e4e4dc" stroke-width="1"/><rect x="360" y="112" width="480" height="68" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="380" y="153" font-family="Heebo" font-size="20" fill="#12121c">&lt;role&gt;</text><text x="820" y="153" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">מי, למי, ומה זו הצלחה</text><rect x="360" y="196" width="480" height="68" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="380" y="237" font-family="Heebo" font-size="20" fill="#12121c">&lt;rules&gt;</text><text x="820" y="237" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">גבולות: אסור, חובה, מה כשחסר</text><rect x="360" y="280" width="480" height="100" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="380" y="320" font-family="Heebo" font-size="20" fill="#12121c">&lt;examples&gt;</text><text x="820" y="320" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">זוגות BAD/GOOD</text><text x="820" y="352" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">החלק הארוך, זה מה שמצדיק cache</text><rect x="360" y="396" width="480" height="68" rx="6" fill="#fbfbf9" stroke="#12121c" stroke-width="2"/><text x="380" y="437" font-family="Heebo" font-size="20" fill="#12121c">&lt;output_contract&gt;</text><text x="820" y="437" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">סכמה, כמו שהקוד בודק</text><line x1="300" y1="488" x2="900" y2="488" stroke="#ffb454" stroke-width="3" stroke-dasharray="8 6"/><text x="362" y="482" font-family="Heebo" font-size="15" fill="#12121c">breakpoint · cache_control</text><rect x="360" y="512" width="480" height="80" rx="6" fill="#fbfbf9" stroke="#6d6d80" stroke-width="2" stroke-dasharray="6 5"/><text x="380" y="548" font-family="Heebo" font-size="20" fill="#6d6d80">&lt;user&gt;</text><text x="820" y="548" font-family="Heebo" font-size="20" fill="#12121c" text-anchor="end">ה-stories של היום מעשרה agents</text><text x="820" y="578" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">ותאריך היום</text><path d="M340 112 H318 V464 H340" fill="none" stroke="#ffb454" stroke-width="3"/><text x="300" y="270" font-family="Heebo" font-weight="700" font-size="22" fill="#12121c" text-anchor="end">prefix ב-cache</text><text x="300" y="300" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">קריאה ≈ 0.1× ממחיר קלט</text><text x="300" y="326" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">כתיבה ראשונה 1.25×</text><path d="M340 512 H318 V592 H340" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="300" y="548" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">נשלח מחדש</text><text x="300" y="574" font-family="Heebo" font-size="18" fill="#6d6d80" text-anchor="end">בכל ריצה</text><rect x="880" y="118" width="170" height="44" rx="6" fill="none" stroke="#12121c" stroke-width="2"/><text x="1035" y="147" font-family="Heebo" font-size="18" fill="#12121c" text-anchor="end">תאריך היום</text><line x1="872" y1="140" x2="1058" y2="140" stroke="#ffb454" stroke-width="3"/><path d="M965 168 Q1060 380 856 545" fill="none" stroke="#12121c" stroke-width="1" stroke-dasharray="5 4"/><polygon points="850,550 864,530 872,548" fill="#12121c"/><text x="1140" y="330" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">בשורה הראשונה = cache שבור</text><text x="1140" y="354" font-family="Heebo" font-size="17" fill="#6d6d80" text-anchor="end">מקומו ב-user message</text></svg>