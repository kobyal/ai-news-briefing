<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"><rect width="1200" height="675" fill="#fbfbf9"/><text x="60" y="62" font-family="Frank Ruhl Libre" font-weight="700" font-size="34" fill="#12121c">One decision, two ways to get it</text><text x="60" y="122" font-family="Heebo" font-size="22" fill="#12121c">LLM with JSON mode: writes a string, token by token</text><rect x="60" y="150" width="124" height="56" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="122" y="185" font-family="Heebo" font-size="19" fill="#6d6d80" text-anchor="middle">{"intent</text><rect x="200" y="150" width="124" height="56" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="262" y="185" font-family="Heebo" font-size="19" fill="#6d6d80" text-anchor="middle">":"ref</text><rect x="340" y="150" width="124" height="56" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="402" y="185" font-family="Heebo" font-size="19" fill="#6d6d80" text-anchor="middle">und",</text><rect x="480" y="150" width="124" height="56" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="542" y="185" font-family="Heebo" font-size="19" fill="#6d6d80" text-anchor="middle">"urgent</text><rect x="620" y="150" width="124" height="56" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="682" y="185" font-family="Heebo" font-size="19" fill="#6d6d80" text-anchor="middle">":"y</text><rect x="760" y="150" width="124" height="56" rx="6" fill="none" stroke="#6d6d80" stroke-width="2"/><text x="822" y="185" font-family="Heebo" font-size="19" fill="#6d6d80" text-anchor="middle">es"}</text><line x1="892" y1="178" x2="934" y2="178" stroke="#12121c" stroke-width="2"/><rect x="940" y="150" width="200" height="56" rx="6" fill="none" stroke="#12121c" stroke-width="1" stroke-dasharray="6 5"/><text x="1040" y="185" font-family="Heebo" font-size="19" fill="#12121c" text-anchor="middle">parse → validate → ?</text><text x="60" y="252" font-family="Heebo" f